<style>/* Layout: sticky language bar, sticky contents rail on the left, one reading column (~68ch) with code and tables allowed to scroll. */
:root {
  --bg: #f6f5f3;
  --surface: #ffffff;
  --ink: #1c1a18;
  --muted: #6a645e;
  --line: #e4dfda;
  --accent: #25d366;
  --accent-ink: #12803d;
  --accent-soft: #dcf8e6;
  --code-bg: #1d1b1a;
  --code-ink: #ece6e0;
  --ok: #1e7f49; --ok-soft: #dff3e7;
  --warn: #9a6408; --warn-soft: #fbf0d6;
  --bad: #b3261e; --bad-soft: #f9e0dd;
  --info: #285e9a; --info-soft: #e1ecf8;
  --f-display: "Schibsted Grotesk", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-1: .8125rem; --s0: 1rem; --s1: 1.1875rem; --s2: 1.5rem; --s3: 2.125rem; --s4: 2.875rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141312; --surface: #1c1a19; --ink: #ede8e3; --muted: #a39b93; --line: #302c29;
    --accent: #25d366; --accent-ink: #5be68f; --accent-soft: #12301f;
    --code-bg: #0f0e0d; --code-ink: #ece6e0;
    --ok: #5cc98a; --ok-soft: #173325; --warn: #e2b45a; --warn-soft: #362a12;
    --bad: #f08a80; --bad-soft: #3d1c19; --info: #8fbcf0; --info-soft: #182a3f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141312; --surface: #1c1a19; --ink: #ede8e3; --muted: #a39b93; --line: #302c29;
  --accent: #25d366; --accent-ink: #5be68f; --accent-soft: #12301f;
  --code-bg: #0f0e0d; --code-ink: #ece6e0;
  --ok: #5cc98a; --ok-soft: #173325; --warn: #e2b45a; --warn-soft: #362a12;
  --bad: #f08a80; --bad-soft: #3d1c19; --info: #8fbcf0; --info-soft: #182a3f;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font: 400 var(--s0)/1.65 var(--f-body); }
html[lang="zh-CN"] body, [lang="zh-CN"] { font-family: "Noto Sans SC", var(--f-body); }
a { color: var(--accent-ink); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

html[data-lang="pt"] [data-l]:not([data-l="pt"]),
html[data-lang="en"] [data-l]:not([data-l="en"]),
html[data-lang="zh"] [data-l]:not([data-l="zh"]) { display: none; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 .95rem var(--f-display); }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #052e16; display: grid; place-items: center; font-size: .85rem; }
.rfcno { font: 600 .75rem var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface); gap: 2px; }
.langs button { font: 600 .8rem var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* layout */
.layout { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px;
  padding-block: 32px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
.toc summary { font: 700 .72rem var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); cursor: pointer; list-style: none; padding-block: 4px 10px; }
.toc summary::-webkit-details-marker { display: none; }
.toc-list { display: none; margin: 0; padding: 0; list-style: none; counter-reset: t; }
.toc-list.active { display: block; }
.toc-list li { counter-increment: t; }
.toc-list a { display: grid; grid-template-columns: 2.1em 1fr; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .88rem; line-height: 1.35; }
.toc-list a::before { content: counter(t, decimal-leading-zero); font: 500 .74rem var(--f-mono); color: var(--muted); padding-top: 2px; }
.toc-list a:hover { background: var(--surface); }
main { min-width: 0; }
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 72px; }
  .toc { position: static; max-height: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
  .toc summary { padding-block: 2px; }
}

/* language containers: inactive ones stay laid out off-screen so diagrams measure correctly */
.lang { min-width: 0; }
.lang:not(.active) { position: absolute; left: -12000px; top: 0; width: 820px; height: 0; overflow: hidden; visibility: hidden; }

/* hero */
.hero { padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.eyebrow { font: 600 .74rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font: 800 var(--s4)/1.08 var(--f-display); letter-spacing: -.02em; margin: 10px 0 14px; text-wrap: balance; max-width: 22ch; }
.lede { font-size: var(--s1); color: var(--muted); max-width: 62ch; margin: 0; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 24px; }
.meta div { background: var(--surface); padding: 10px 14px; }
.meta dt { font: 600 .7rem var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: 2px 0 0; font-weight: 500; }
.pill { display: inline-block; font: 600 .74rem var(--f-body); padding: 1px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }

/* sections */
section { padding-top: 40px; scroll-margin-top: 70px; }
h2 { font: 700 var(--s3)/1.15 var(--f-display); letter-spacing: -.015em; margin: 0 0 14px; text-wrap: balance; scroll-margin-top: 80px; display: flex; gap: 14px; align-items: baseline; }
h2 .n { font: 500 .9rem var(--f-mono); color: var(--accent-ink); flex: none; }
h3 { font: 700 var(--s1)/1.3 var(--f-display); margin: 30px 0 8px; text-wrap: balance; scroll-margin-top: 80px; }
h4 { font: 600 .78rem var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 6px; }
p, li { max-width: 68ch; }
p { margin: 0 0 14px; }
ul, ol { padding-left: 1.3em; margin: 0 0 14px; }
li { margin-bottom: 6px; }
li::marker { color: var(--muted); }
code { font: .86em var(--f-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: .05em .35em; overflow-wrap: anywhere; }
strong { font-weight: 600; }

/* callouts */
.note-box { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 18px 0; max-width: 72ch; }
.note-box p:last-child, .note-box ul:last-child { margin-bottom: 0; }
.note-box .lbl { font: 600 .72rem var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); display: block; margin-bottom: 4px; }
.decision { border-left-color: var(--ok); }
.decision .lbl { color: var(--ok); }
.risk { border-left-color: var(--bad); }
.risk .lbl { color: var(--bad); }

/* code */
figure.code { margin: 16px 0 20px; background: var(--code-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
figure.code figcaption { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 6px 14px; border-bottom: 1px solid #ffffff14; font: 600 .68rem var(--f-mono); letter-spacing: .1em; color: #a59c93; }
figure.code button { font: 600 .66rem var(--f-mono); letter-spacing: .08em; background: #ffffff10; color: #d8d0c8; border: 1px solid #ffffff1c; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
figure.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; color: var(--code-ink); font: .82rem/1.6 var(--f-mono); tab-size: 2; }
figure.code code { background: none; border: 0; padding: 0; font: inherit; overflow-wrap: normal; }
.t-k { color: #ffab7a; } .t-s { color: #a8d8a0; } .t-n { color: #f5c76b; } .t-b { color: #9ec5ff; } .t-c { color: #8a8178; font-style: italic; } .t-h { color: #9ec5ff; }

/* endpoints */
.eps { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 14px 0 20px; overflow: hidden; }
.ep { display: grid; grid-template-columns: 64px minmax(0, max-content) minmax(0, 1fr); gap: 4px 14px; align-items: baseline; padding: 10px 14px; border-top: 1px solid var(--line); }
.ep:first-child { border-top: 0; }
.ep .p { background: none; border: 0; padding: 0; font-size: .84rem; font-weight: 600; }
.ep .d { color: var(--muted); font-size: .9rem; }
.m { font: 700 .68rem var(--f-mono); text-align: center; padding: 3px 0; border-radius: 5px; letter-spacing: .04em; }
.m-get { background: var(--info-soft); color: var(--info); } .m-post { background: var(--accent-soft); color: var(--accent-ink); }
.m-put { background: var(--warn-soft); color: var(--warn); } .m-delete { background: var(--bad-soft); color: var(--bad); }
@media (max-width: 640px) { .ep { grid-template-columns: 58px minmax(0, 1fr); } .ep .d { grid-column: 1 / -1; } }

/* tables */
.tbl { overflow-x: auto; margin: 14px 0 22px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font: 600 .7rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td code { white-space: nowrap; }
.tbl.num td:first-child { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: .82rem; }
.yes { color: var(--ok); font-weight: 600; } .no { color: var(--bad); font-weight: 600; } .part { color: var(--warn); font-weight: 600; }

/* diagrams */
.diagram { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px; margin: 16px 0 6px; overflow-x: auto; }
.diagram pre.mermaid { margin: 0; background: none; text-align: center; font-family: var(--f-body); white-space: pre; }
.diagram pre.mermaid svg { max-width: 100%; height: auto; }
.cap { font-size: .82rem; color: var(--muted); margin: 0 0 20px; }

/* screens mock list for developer area */
.screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 16px 0 22px; }
.screen { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.screen h5 { margin: 0 0 6px; font: 700 .95rem var(--f-display); }
.screen .path { font: 500 .72rem var(--f-mono); color: var(--accent-ink); display: block; margin-bottom: 8px; }
.screen ul { margin: 0; padding-left: 1.1em; font-size: .88rem; color: var(--muted); }
.screen li { margin-bottom: 3px; }

/* portal mock */
.mock { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); margin: 16px 0 6px; }
.mock-top { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 500 .75rem var(--f-mono); color: var(--muted); }
.mock-top i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.mock-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); min-height: 260px; }
.mock-nav { border-right: 1px solid var(--line); padding: 12px 8px; font-size: .82rem; display: flex; flex-direction: column; gap: 2px; }
.mock-nav span { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
.mock-nav span.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.mock-nav .grp { font: 600 .66rem var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 10px 10px 4px; color: var(--muted); }
.mock-main { padding: 16px 18px; min-width: 0; }
.mock-main h6 { font: 700 1rem var(--f-display); margin: 0 0 12px; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; font-size: .85rem; align-items: center; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.kv code { overflow-wrap: anywhere; }
.chip { font: 600 .7rem var(--f-body); padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.chip.w { background: var(--warn-soft); color: var(--warn); }
.fakebtn { font: 600 .74rem var(--f-body); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; color: var(--ink); white-space: nowrap; }
.fakebtn.pri { background: var(--accent); border-color: var(--accent); color: #052e16; }
@media (max-width: 640px) { .mock-body { grid-template-columns: minmax(0, 1fr); } .mock-nav { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } .mock-nav .grp { display: none; } .kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; } .kv dd { margin-bottom: 8px; } }

/* phases */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 16px 0 22px; }
.phase { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px; min-width: 0; }
.phase .tag { font: 600 .7rem var(--f-mono); color: var(--accent-ink); letter-spacing: .06em; }
.phase h5 { margin: 4px 0 8px; font: 700 1rem var(--f-display); }
.phase ul { margin: 0; padding-left: 1.1em; font-size: .87rem; }
.phase.first { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* questions */
.qs { counter-reset: q; list-style: none; padding: 0; }
.qs li { counter-increment: q; position: relative; padding: 12px 0 12px 3.2em; border-top: 1px solid var(--line); max-width: 76ch; margin: 0; }
.qs li::before { content: "Q" counter(q); position: absolute; left: 0; top: 14px; font: 600 .8rem var(--f-mono); color: var(--accent-ink); }

/* swagger */
.swagger-wrap { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #ffffff; color: #1c1a18; color-scheme: light; }
.swagger-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid #e4dfda; background: #faf9f7; }
.btn { font: 600 .82rem var(--f-body); border: 1px solid #d9d2cb; background: #ffffff; color: #1c1a18; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: #25d366; }
.swagger-tools .note { font-size: .82rem; color: #6a645e; }
#yaml-fallback { width: calc(100% - 32px); margin: 12px 16px; min-height: 200px; font: .78rem var(--f-mono); }
#swagger-ui { padding: 0 8px 12px; min-height: 200px; }
.swagger-ui .info { margin: 24px 0 8px; }
.swagger-ui .info .title { font-family: var(--f-display); }
.swagger-ui, .swagger-ui .opblock-tag, .swagger-ui .opblock .opblock-summary-description { font-family: var(--f-body); }
.swagger-ui .wrapper { padding: 0 12px; max-width: none; }
.swagger-ui .scheme-container { box-shadow: none; padding: 12px 0; background: transparent; }

@media (max-width: 640px) { h1 { font-size: 2.1rem; } h2 { font-size: 1.6rem; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
html { scroll-behavior: smooth; }
@media (max-width: 480px) { .brand > span:nth-child(2) { display: none; } .bar-in { flex-wrap: nowrap; } .langs button { padding: 6px 9px; } }

.tbl.changes table { min-width: 960px; }
.tbl.changes td { width: 25%; }
.tbl.changes td:first-child { color: var(--muted); }
.tbl.changes td:nth-child(3) { font-weight: 500; }
.tbl.changes td:last-child { font-style: italic; }

/* Mockup gallery (images live next to the hosted page, in ./mocks/) */
.shots { display: grid; gap: 22px; margin: 16px 0 26px; }
.shot { margin: 0; min-width: 0; }
.shot a { display: block; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.shot a:hover { border-color: var(--accent); }
.shot img { display: block; width: 100%; height: auto; }
.shot > img { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.shot > img.zoomable { cursor: zoom-in; }
.shot > img.missing { min-height: 120px; }
.shot .cap { margin: 8px 2px 0; }
.shot .cap b { color: var(--ink); font-weight: 600; }

/* PHZ-0002 additions */
.m-patch { background: var(--info-soft); color: var(--info); }
.map td:first-child, .map td:nth-child(2) { font-family: var(--f-mono); font-size: .8rem; overflow-wrap: anywhere; }
.map td:nth-child(3) { white-space: nowrap; }
.map table { min-width: 820px; }
.st { display: inline-block; font: 600 .7rem var(--f-body); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.st.eq { background: var(--ok-soft); color: var(--ok); }
.st.ch { background: var(--warn-soft); color: var(--warn); }
.st.gap { background: var(--bad-soft); color: var(--bad); }
.st.new { background: var(--info-soft); color: var(--info); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 22px; }
.stat { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px; }
.stat b { display: block; font: 800 1.9rem/1.1 var(--f-display); color: var(--accent-ink); }
.stat span { font-size: .84rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .82rem; color: var(--muted); margin: 6px 0 12px; }
.shots.phones { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
</style>


</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><span class="logo" aria-hidden="true">P</span><span>PHIZCHAT</span><span class="rfcno">RFC PHZ-0001</span></div>
    <div class="langs" role="group" aria-label="Language / Idioma / 语言">
      <button type="button" data-set-lang="pt" id="btn-pt">PT-BR</button>
      <button type="button" data-set-lang="en" id="btn-en">EN-US</button>
      <button type="button" data-set-lang="zh" id="btn-zh">中文</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="toc" aria-label="Sumário">
    <details open id="toc-details">
      <summary><span data-l="pt">Sumário</span><span data-l="en">Contents</span><span data-l="zh">目录</span></summary>
      
    </details>
  </aside>
  <main>
    <div class="lang" data-lang="pt" lang="pt-BR"><header class="hero">
  <div class="eyebrow">RFC PHZ-0001 · OpenAPI</div>
  <h1>PHIZ Business Messaging API</h1>
  <p class="lede"><a href="../../../rfc/?id=PHZ-0001">PHZ-0001</a></p>
</header></div>
<div class="lang" data-lang="en" lang="en-US"><header class="hero">
  <div class="eyebrow">RFC PHZ-0001 · OpenAPI</div>
  <h1>PHIZ Business Messaging API</h1>
  <p class="lede"><a href="../../../rfc/?id=PHZ-0001">PHZ-0001</a></p>
</header></div>
<div class="lang" data-lang="zh" lang="zh-CN"><header class="hero">
  <div class="eyebrow">RFC PHZ-0001 · OpenAPI</div>
  <h1>PHIZ 商家消息 API</h1>
  <p class="lede"><a href="../../../rfc/?id=PHZ-0001">PHZ-0001</a></p>
</header></div>

<script>
(function () {
  const LANGS = ["pt", "en", "zh"];
  let current = null;

  function pick() {
    const h = (location.hash || "").replace("#", "");
    if (LANGS.includes(h)) return h;
    const pre = LANGS.find(l => h.startsWith(l + "-"));
    if (pre) return pre;
    try { const s = localStorage.getItem("phiz-rfc-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
    return "pt";
  }


  function setLang(lang) {
    if (lang === current) return;
    current = lang;
    document.documentElement.setAttribute("lang", { pt: "pt-BR", en: "en", zh: "zh-CN" }[lang]);
    document.documentElement.dataset.lang = lang;
    document.querySelectorAll(".lang, .toc-list").forEach(el => el.classList.toggle("active", el.dataset.lang === lang));
    document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setLang === lang)));
    try { localStorage.setItem("phiz-rfc-lang", lang); } catch (e) {}
  }

  document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => {
    const sec = location.hash.replace("#", "");
    setLang(b.dataset.setLang);
    if (sec.length > 3) {
      const target = document.getElementById(b.dataset.setLang + sec.slice(2));
      if (target) target.scrollIntoView();
    }
  }));

  window.addEventListener("hashchange", () => { const l = pick(); if (l !== current) setLang(l); });

  async function copyText(text, onFail) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { onFail && onFail(); return false; }
  }

  document.addEventListener("click", async e => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const code = btn.closest("figure").querySelector("code");
    const ok = await copyText(code.innerText, () => {
      const r = document.createRange(); r.selectNodeContents(code);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
    btn.textContent = ok ? "COPIED" : "SELECTED";
    setTimeout(() => (btn.textContent = "COPY"), 1600);
  });


  if (matchMedia("(max-width: 960px)").matches) document.getElementById("toc-details").removeAttribute("open");
  setLang(pick());
  // pages whose content is drawn after load (RFCs from the database) call this once it exists
  window.phizApplyLang = () => { current = null; setLang(pick()); };
})();
</script>

evolvido no handshake GET."}, "fields": {"type": "array", "items": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "example": ["messages", "message_status"]}, "status": {"type": "string", "readOnly": true, "enum": ["verified", "pending_verification", "failing", "disabled"]}}}, "WebhookEvent": {"type": "object", "description": "Envelope de todos os eventos. `entry[].id` é o BA ID. Pode agrupar vários eventos do mesmo Business Account.", "properties": {"object": {"type": "string", "enum": ["phiz_business_account"]}, "entry": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string", "example": "ba_7Kq2M9xTpL"}, "changes": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "value": {"type": "object"}}}}}}}}}, "ErrorDetail": {"type": "object", "properties": {"code": {"type": "integer", "example": 2104}, "title": {"type": "string", "example": "recipient_not_reachable"}, "message": {"type": "string"}, "href": {"type": "string", "format": "uri"}}}, "OAuthError": {"type": "object", "description": "RFC 6749 §5.2", "properties": {"error": {"type": "string", "enum": ["invalid_request", "invalid_client", "invalid_scope", "unsupported_grant_type"]}, "error_description": {"type": "string", "example": "Client authentication failed."}}}, "Error": {"type": "object", "properties": {"error": {"type": "object", "properties": {"code": {"type": "integer", "example": 1003}, "type": {"type": "string", "example": "invalid_request"}, "message": {"type": "string", "example": "Field 'to' must be E.164 when to_type is 'phone'."}, "details": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string"}, "issue": {"type": "string"}}}}, "trace_id": {"type": "string", "example": "trc_9f2c41ab"}}}}}}, "responses": {"BadRequest": {"description": "Requisição inválida.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "Unauthorized": {"description": "Token ausente, inválido ou expirado.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": {"code": 1101, "type": "unauthorized", "message": "Access token expired.", "trace_id": "trc_1a2b"}}}}}, "Forbidden": {"description": "A integração não tem o escopo ou acesso ao remetente.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "NotFound": {"description": "Recurso não encontrado.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "TooManyRequests": {"description": "Limite de requisições atingido. Respeite Retry-After.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}, "headers": {"Retry-After": {"schema": {"type": "integer"}}}}, "ServerError": {"description": "Erro interno. Pode ser repetido com a mesma Idempotency-Key.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "en": {"openapi": "3.1.0", "info": {"title": "PHIZ Business Messaging API", "version": "1.0.0-draft", "description": "PHIZ business messaging API. It lets third-party systems (CRMs, customer-service platforms such as Blip and Salesforce, or the merchant's own systems) send messages to PHIZ users identified by **phone number** or **Open ID**, and receive replies and status changes through a **webhook**.\n\nMessage and webhook payloads closely follow Meta's Cloud API (WhatsApp Business Platform) to keep the cost of adapting existing integrations low.\n\n**Status:** proposal (RFC PHZ-0001). Nothing here is implemented yet.", "contact": {"name": "PHIZ Open Platform", "url": "https://open.phiz.chat"}}, "servers": [{"url": "https://{gateway}/gateway/business", "description": "Production: current PHIZ gateway, /gateway/business prefix", "variables": {"gateway": {"default": "gateway.phiz.chat", "description": "Production gateway host (illustrative value)."}}}, {"url": "https://{gateway}/gateway/business", "description": "Sandbox: test gateway (Openapi-test), same prefix", "variables": {"gateway": {"default": "gateway-test.phiz.chat", "description": "Test gateway host (illustrative value)."}}}], "tags": [{"name": "Auth", "description": "OAuth 2.0 token issuance and revocation (client credentials)."}, {"name": "Account", "description": "Application, Business Accounts and senders."}, {"name": "Messages", "description": "Send messages to a phone number or Open ID and query their status."}, {"name": "Media", "description": "Media upload to PHIZ temporary storage. All media sent in messages must go through here; third-party links are not accepted."}, {"name": "Webhooks", "description": "Events delivered to your server. In Phase 1, the partner registers the webhook URL under Event subscriptions in the Developer Center; the app setup endpoints (`/v1/apps/{app_id}/webhook…`) belong to Phase 2."}], "security": [{"bearerAuth": []}], "paths": {"/oauth/token": {"post": {"tags": ["Auth"], "summary": "Get access token", "description": "Exchanges client_id and client_secret for a Bearer access token (OAuth 2.0, RFC 6749 §4.4). There is no refresh token: when the token expires, request a new one. Accepts `application/x-www-form-urlencoded` (OAuth standard) and `application/json`.", "operationId": "getToken", "security": [], "requestBody": {"required": true, "content": {"application/x-www-form-urlencoded": {"schema": {"$ref": "#/components/schemas/TokenRequest"}}, "application/json": {"schema": {"$ref": "#/components/schemas/TokenRequest"}, "example": {"grant_type": "client_credentials", "client_id": "app_2Fk81PzQ", "client_secret": "phzsk_live_9c1f…", "scope": "messages:send messages:read"}}}}, "responses": {"200": {"description": "Token issued.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenResponse"}, "example": {"access_token": "eyJhbGciOiJFUzI1NiIs…", "token_type": "Bearer", "expires_in": 3600, "scope": "messages:send messages:read", "developer_id": "7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57"}}}}, "400": {"description": "Invalid request (`invalid_request`, `invalid_scope`, `unsupported_grant_type`).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OAuthError"}}}}, "401": {"description": "Invalid credentials (`invalid_client`).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OAuthError"}, "example": {"error": "invalid_client", "error_description": "Client authentication failed."}}}}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/oauth/revoke": {"post": {"tags": ["Auth"], "summary": "Revoke token", "description": "Revokes an access token before it expires (RFC 7009). Always returns 200, even if the token was already invalid.", "operationId": "revokeToken", "security": [], "requestBody": {"required": true, "content": {"application/x-www-form-urlencoded": {"schema": {"type": "object", "required": ["token", "client_id", "client_secret"], "properties": {"token": {"type": "string"}, "client_id": {"type": "string"}, "client_secret": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK"}}}}, "/v1/me": {"get": {"tags": ["Auth"], "summary": "Inspect current token", "description": "Returns the application, Developer ID, scopes and senders (Business Accounts and channels) of the token in use. Useful to debug integrations (equivalent to Meta's debug_token).", "operationId": "getMe", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenInfo"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/v1/apps/{app_id}": {"get": {"tags": ["Account"], "summary": "Get application", "description": "Details of the token's application: Developer ID (former Merchant ID), environment and status.", "operationId": "getApp", "parameters": [{"name": "app_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "app_2Fk81PzQ", "description": "Developer app ID."}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/App"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/apps/{app_id}/senders": {"get": {"tags": ["Account"], "summary": "List senders", "description": "The application's senders: the Business Accounts created in it and, if any, the allowed channels.", "operationId": "listSenders", "parameters": [{"name": "app_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "app_2Fk81PzQ", "description": "Developer app ID."}, {"name": "cursor", "in": "query", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "default": 25, "maximum": 100}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SenderList"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}}}}, "/v1/senders/{sender_id}": {"get": {"tags": ["Account"], "summary": "Get sender", "description": "Sender status, messaging limit and quality.", "operationId": "getSender", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "Sender ID: external reference mapped to the BA ID of one of the application's Business Accounts (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API's phone_number_id."}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Sender"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/{sender_id}/messages": {"post": {"tags": ["Messages"], "summary": "Send message", "description": "Sends a message to a phone number (E.164) or Open ID, on behalf of one of the application's Business Accounts (`sender_id` mapped to the BA ID) or, optionally, through a channel. The phone number is converted to the user's Open ID; the Business Account is bound to the Open ID, not to the number. The `202` response only confirms the message was accepted; the final outcome (`sent`, `delivered`, `read` or `failed`) arrives through the `message_status` webhook.\n\nMerchant-initiated messages follow the opt-in policy, to be defined by Product.\n\nThe same endpoint with `status: read` marks an inbound message as read (Cloud API compatible).", "operationId": "sendMessage", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "Sender ID: external reference mapped to the BA ID of one of the application's Business Accounts (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API's phone_number_id."}, {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 128}, "example": "pedido-48213-confirmacao", "description": "Unique key per logical request. Reusing the same key within 24 h returns the original response without sending the message again."}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/SendMessageRequest"}, {"$ref": "#/components/schemas/MarkReadRequest"}]}, "examples": {"text_phone": {"summary": "Text to phone number", "value": {"messaging_product": "phiz", "to": "+5511987654321", "to_type": "phone", "type": "text", "text": {"body": "Olá, Maria! Seu pedido #48213 foi enviado.", "preview_url": false}, "biz_opaque_callback_data": "pedido=48213"}}, "text_open_id": {"summary": "Text to Open ID", "value": {"to": "oid_Qm7f2K9xT4Lw", "to_type": "open_id", "type": "text", "text": {"body": "Seu cupom chegou: PHIZ10"}}}, "image": {"summary": "Image by media id", "value": {"to": "+5511987654321", "type": "image", "image": {"id": "pmed.01JB2K3H2D", "caption": "Nota fiscal"}}}, "audio": {"summary": "Audio by media id", "value": {"to": "+5511987654321", "type": "audio", "audio": {"id": "pmed.01JB2K4M7A"}}}, "video": {"summary": "Video by PHIZ link", "value": {"to": "oid_Qm7f2K9xT4Lw", "to_type": "open_id", "type": "video", "video": {"link": "https://media.phiz.chat/biz/pmed.01JB2K5V1C", "caption": "Como montar seu produto"}}}, "document": {"summary": "Document", "value": {"to": "+5511987654321", "type": "document", "document": {"id": "pmed.01JB2K7Q9X", "filename": "nota-fiscal-48213.pdf", "caption": "Nota fiscal do pedido #48213"}}}, "buttons": {"summary": "Reply buttons", "value": {"to": "+5511987654321", "type": "interactive", "interactive": {"type": "button", "body": {"text": "Confirma a entrega amanhã entre 9h e 12h?"}, "action": {"buttons": [{"type": "reply", "reply": {"id": "confirmar", "title": "Confirmar"}}, {"type": "reply", "reply": {"id": "reagendar", "title": "Reagendar"}}]}}}}, "mark_read": {"summary": "Mark as read", "value": {"messaging_product": "phiz", "status": "read", "message_id": "pmid.IN_01JA9W2C"}}}}}}, "responses": {"202": {"description": "Message accepted for delivery.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SendMessageResponse"}, "example": {"messaging_product": "phiz", "contacts": [{"input": "+5511987654321", "open_id": null}], "messages": [{"id": "pmid.01JA9VZ6T8R3", "message_status": "accepted"}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "409": {"description": "Idempotency-Key reused with a different body.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"description": "Sending not allowed by the opt-in policy (2201), type not allowed (2202), outside the service window (2203), template not approved (2204), restricted time or region (2205), or media expired (2303).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": {"code": 2201, "type": "policy_violation", "message": "Sending to this recipient is not allowed by the opt-in policy.", "trace_id": "trc_77ac"}}}}}}}}, "/v1/{sender_id}/recipients/resolve": {"post": {"tags": ["Messages"], "summary": "Resolve recipient (proposal)", "description": "**Proposal from PHZ-BM-0001, open (Q18).** Tells whether the Business Account can send to the phone number now, without revealing whether the number has a PHIZ account. Requires the `recipients:resolve` scope and a relation with the user.", "operationId": "resolveRecipient", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "Sender ID: external reference mapped to the BA ID of one of the application's Business Accounts (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API's phone_number_id."}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResolveRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ResolveResponse"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}}}}, "/v1/{sender_id}/media": {"post": {"tags": ["Media"], "summary": "Upload media", "description": "Uploads a file to PHIZ temporary storage and returns the `id` and `link` to use when sending. Format and size are checked here: outside the table in section 09, it answers 415 (2304) or 413 (2305).\n\nThe file stays available until `expires_at` (proposed: 30 days) and can be used in many sends by senders of the same application. Requires the `messages:send` scope.", "operationId": "uploadMedia", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "Sender ID: external reference mapped to the BA ID of one of the application's Business Accounts (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API's phone_number_id."}], "requestBody": {"required": true, "content": {"multipart/form-data": {"schema": {"$ref": "#/components/schemas/MediaUploadRequest"}}}}, "responses": {"200": {"description": "Media stored.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Media"}, "example": {"id": "pmed.01JB2K7Q9X", "link": "https://media.phiz.chat/biz/pmed.01JB2K7Q9X", "mime_type": "application/pdf", "file_size": 184320, "sha256": "9b1f…", "expires_at": "2026-11-19T14:00:00Z"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "413": {"description": "File above the maximum size for its type (2305).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "415": {"description": "Format not accepted (2304).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/v1/media/{media_id}": {"get": {"tags": ["Media"], "summary": "Get media", "description": "Link, type, size and expiry of an uploaded media file.", "operationId": "getMedia", "parameters": [{"name": "media_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "pmed.01JB2K7Q9X"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Media"}, "example": {"id": "pmed.01JB2K7Q9X", "link": "https://media.phiz.chat/biz/pmed.01JB2K7Q9X", "mime_type": "application/pdf", "file_size": 184320, "sha256": "9b1f…", "expires_at": "2026-11-19T14:00:00Z"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}, "delete": {"tags": ["Media"], "summary": "Delete media", "description": "Deletes the media before it expires. Sends that still use the `id` or `link` fail with 2303.", "operationId": "deleteMedia", "parameters": [{"name": "media_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "pmed.01JB2K7Q9X"}], "responses": {"204": {"description": "Media deleted."}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/messages/{message_id}": {"get": {"tags": ["Messages"], "summary": "Get message status", "description": "Latest known status of a sent message. Use as a fallback; the webhook remains the primary source. Data retained for 30 days.", "operationId": "getMessage", "parameters": [{"name": "message_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "pmid.01JA9VZ6T8R3"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MessageStatus"}, "example": {"id": "pmid.01JA9VZ6T8R3", "sender_id": "1231", "status": "delivered", "updated_at": "2026-10-15T11:42:07Z", "biz_opaque_callback_data": "pedido=48213", "errors": []}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/apps/{app_id}/webhook": {"get": {"tags": ["Webhooks"], "summary": "Get webhook", "description": "**Phase 2.** App webhook subscription settings and health.", "operationId": "getWebhook", "parameters": [{"name": "app_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "app_2Fk81PzQ", "description": "Developer app ID."}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/WebhookConfig"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}}}, "put": {"tags": ["Webhooks"], "summary": "Set webhook", "description": "**Phase 2.** Sets URL, verify_token and events. PHIZ performs the GET handshake e": "array", "items": {"$ref": "#/components/schemas/ErrorDetail"}}}}, "MarkReadRequest": {"type": "object", "required": ["status", "message_id"], "properties": {"messaging_product": {"type": "string", "enum": ["phiz"]}, "status": {"type": "string", "enum": ["read"]}, "message_id": {"type": "string", "example": "pmid.IN_01JA9W2C"}, "typing_indicator": {"type": "boolean", "default": false}}}, "WebhookConfig": {"type": "object", "required": ["url", "verify_token"], "properties": {"url": {"type": "string", "format": "uri", "example": "https://integracao.lojaexemplo.com.br/phiz/webhook"}, "verify_token": {"type": "string", "writeOnly": true, "example": "um-texto-que-so-voce-conhece", "description": "Text you choose, sent back in the GET handshake."}, "fields": {"type": "array", "items": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "example": ["messages", "message_status"]}, "status": {"type": "string", "readOnly": true, "enum": ["verified", "pending_verification", "failing", "disabled"]}}}, "WebhookEvent": {"type": "object", "description": "Envelope for every event. `entry[].id` is the BA ID. May batch several events of the same Business Account.", "properties": {"object": {"type": "string", "enum": ["phiz_business_account"]}, "entry": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string", "example": "ba_7Kq2M9xTpL"}, "changes": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "value": {"type": "object"}}}}}}}}}, "ErrorDetail": {"type": "object", "properties": {"code": {"type": "integer", "example": 2104}, "title": {"type": "string", "example": "recipient_not_reachable"}, "message": {"type": "string"}, "href": {"type": "string", "format": "uri"}}}, "OAuthError": {"type": "object", "description": "RFC 6749 §5.2", "properties": {"error": {"type": "string", "enum": ["invalid_request", "invalid_client", "invalid_scope", "unsupported_grant_type"]}, "error_description": {"type": "string", "example": "Client authentication failed."}}}, "Error": {"type": "object", "properties": {"error": {"type": "object", "properties": {"code": {"type": "integer", "example": 1003}, "type": {"type": "string", "example": "invalid_request"}, "message": {"type": "string", "example": "Field 'to' must be E.164 when to_type is 'phone'."}, "details": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string"}, "issue": {"type": "string"}}}}, "trace_id": {"type": "string", "example": "trc_9f2c41ab"}}}}}}, "responses": {"BadRequest": {"description": "Invalid request.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "Unauthorized": {"description": "Missing, invalid or expired token.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": {"code": 1101, "type": "unauthorized", "message": "Access token expired.", "trace_id": "trc_1a2b"}}}}}, "Forbidden": {"description": "The app lacks the scope or access to the sender.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "NotFound": {"description": "Resource not found.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "TooManyRequests": {"description": "Rate limit reached. Honour Retry-After.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}, "headers": {"Retry-After": {"schema": {"type": "integer"}}}}, "ServerError": {"description": "Internal error. Safe to retry with the same Idempotency-Key.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "zh": {"openapi": "3.1.0", "info": {"title": "PHIZ Business Messaging API", "version": "1.0.0-draft", "description": "PHIZ 企业消息 API。第三方系统（CRM、Blip 和 Salesforce 等客服平台，或商户自有系统）可以通过 **手机号** 或 **Open ID** 向 PHIZ 用户发送消息，并通过 **Webhook** 接收用户回复和状态变更。\n\n消息与 Webhook 的数据结构尽量对齐 Meta Cloud API（WhatsApp Business Platform），以降低现有集成的改造成本。\n\n**状态：** 提案（RFC PHZ-0001），尚未实现。", "contact": {"name": "PHIZ Open Platform", "url": "https://open.phiz.chat"}}, "servers": [{"url": "https://{gateway}/gateway/business", "description": "生产环境：现有 PHIZ 网关，前缀 /gateway/business", "variables": {"gateway": {"default": "gateway.phiz.chat", "description": "生产网关主机（示例值）。"}}}, {"url": "https://{gateway}/gateway/business", "description": "沙箱环境：测试网关（Openapi-test），相同前缀", "variables": {"gateway": {"default": "gateway-test.phiz.chat", "description": "测试网关主机（示例值）。"}}}], "tags": [{"name": "Auth", "description": "OAuth 2.0 令牌签发与撤销（客户端凭证模式）。"}, {"name": "Account", "description": "应用、Business Account 与发送方。"}, {"name": "Messages", "description": "向手机号或 Open ID 发送消息并查询状态。"}, {"name": "Media", "description": "将媒体上传到 PHIZ 临时存储。消息中发送的所有媒体都必须经由此处上传；不接受第三方链接。"}, {"name": "Webhooks", "description": "推送到您服务器的事件。第 1 阶段由合作方在开发者中心的事件订阅中登记 Webhook URL；应用配置接口（`/v1/apps/{app_id}/webhook…`）属于第 2 阶段。"}], "security": [{"bearerAuth": []}], "paths": {"/oauth/token": {"post": {"tags": ["Auth"], "summary": "获取访问令牌", "description": "使用 client_id 和 client_secret 换取 Bearer 访问令牌（OAuth 2.0，RFC 6749 §4.4）。不提供刷新令牌：令牌过期后重新申请即可。支持 `application/x-www-form-urlencoded`（OAuth 标准）和 `application/json`。", "operationId": "getToken", "security": [], "requestBody": {"required": true, "content": {"application/x-www-form-urlencoded": {"schema": {"$ref": "#/components/schemas/TokenRequest"}}, "application/json": {"schema": {"$ref": "#/components/schemas/TokenRequest"}, "example": {"grant_type": "client_credentials", "client_id": "app_2Fk81PzQ", "client_secret": "phzsk_live_9c1f…", "scope": "messages:send messages:read"}}}}, "responses": {"200": {"description": "令牌已签发。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenResponse"}, "example": {"access_token": "eyJhbGciOiJFUzI1NiIs…", "token_type": "Bearer", "expires_in": 3600, "scope": "messages:send messages:read", "developer_id": "7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57"}}}}, "400": {"description": "请求无效（`invalid_request`、`invalid_scope`、`unsupported_grant_type`）。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OAuthError"}}}}, "401": {"description": "凭证无效（`invalid_client`）。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/OAuthError"}, "example": {"error": "invalid_client", "error_description": "Client authentication failed."}}}}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/oauth/revoke": {"post": {"tags": ["Auth"], "summary": "撤销令牌", "description": "在过期前撤销访问令牌（RFC 7009）。即使令牌已无效也返回 200。", "operationId": "revokeToken", "security": [], "requestBody": {"required": true, "content": {"application/x-www-form-urlencoded": {"schema": {"type": "object", "required": ["token", "client_id", "client_secret"], "properties": {"token": {"type": "string"}, "client_id": {"type": "string"}, "client_secret": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK"}}}}, "/v1/me": {"get": {"tags": ["Auth"], "summary": "查看当前令牌", "description": "返回当前令牌对应的应用、Developer ID、范围和发送方（Business Account 与频道），便于排查集成问题（相当于 Meta 的 debug_token）。", "operationId": "getMe", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TokenInfo"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/v1/apps/{app_id}": {"get": {"tags": ["Account"], "summary": "查询应用", "description": "令牌所属应用的信息：Developer ID（原 Merchant ID）、环境和状态。", "operationId": "getApp", "parameters": [{"name": "app_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "app_2Fk81PzQ", "description": "开发者应用 ID。"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/App"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/apps/{app_id}/senders": {"get": {"tags": ["Account"], "summary": "列出发送方", "description": "应用的发送方：在该应用下创建的 Business Account，以及已授权的频道（如有）。", "operationId": "listSenders", "parameters": [{"name": "app_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "app_2Fk81PzQ", "description": "开发者应用 ID。"}, {"name": "cursor", "in": "query", "schema": {"type": "string"}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "default": 25, "maximum": 100}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SenderList"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}}}}, "/v1/senders/{sender_id}": {"get": {"tags": ["Account"], "summary": "查询发送方", "description": "发送方状态、发送额度与质量评级。", "operationId": "getSender", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud API 的 phone_number_id。"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Sender"}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "429": {"$ref": "#/components/responses/TooManyRequests"}, "500": {"$ref": "#/components/responses/ServerError"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/v1/{sender_id}/messages": {"post": {"tags": ["Messages"], "summary": "发送消息", "description": "以应用下某个 Business Account 的名义（`sender_id` 映射到 BA ID），或可选地通过频道，向手机号（E.164）或 Open ID 发送消息。手机号会换取用户的 Open ID；Business Account 绑定的是 Open ID，而不是手机号。`202` 仅表示消息已被受理；最终结果（`sent`、`delivered`、`read` 或 `failed`）通过 `message_status` Webhook 推送。\n\n商户主动发送的消息需遵守选择接收（opt-in）策略，该策略由产品定义。\n\n同一接口传入 `status: read` 可将收到的消息标记为已读（兼容 Cloud API）。", "operationId": "sendMessage", "parameters": [{"name": "sender_id", "in": "path", "required": true, "schema": {"type": "string"}, "example": "ba_7Kq2M9xTpL", "description": "发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud API 的 phone_number_id。"}, {"name": "Idempotency-Key", "in": "header", "required": false, "schema": {"type": "string", "maxLength": 128}, "example": "pedido-48213-confirmacao", "description": "每个逻辑请求的唯一键。24 小时内重复使用同一键将返回原始响应，不会重复发送消息。"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/SendMessageRequest"}, {"$ref": "#/components/schemas/MarkReadRequest"}]}, "examples": {"text_phone": {"summary": "向手机号发送文本", "value": {"messaging_product": "phiz", "to": "+5511987654321", "to_type": "phone", "type": "text", "text": {"body": "Olá, Maria! Seu pedido #48213 foi enviado.", "preview_url": false}, "biz_opaque_callback_data": "pedido=48213"}}, "text_open_id": {"summary": "向 Open ID 发送文本", "value": {"to": "oid_Qm7f2K9xT4Lw", "to_type": "open_id", "type": "text", "text": {"body": "Seu cupom chegou: PHIZ10"}}}, "image": {"summary": "通过媒体 id 发送图片", "value": {"to": "+5511987654321", "type": "image", "image": {"id": "pmed.01JB2K3H2D", "caption": "Nota fiscal"}}}, "audio": {"summary": "通过媒体 id 发送音频", "value": {"to": "+5511987654321", "type": "audio", "audio": {"id": "pmed.01JB2K4M7A"}}}, "video": {"summary": "通过 PHIZ 链接发送视频", "value": {"to": "oid_Qm7f2K9xT4Lw", "to_type": "open_id", "type": "video", "video": {"link": "https://media.phiz.chat/biz/pmed.01JB2K5V1C", "capt ple": "+5511987654321", "description": "E.164 格式手机号。"}}}, "ResolveResponse": {"type": "object", "properties": {"addressable": {"type": "boolean", "example": true, "description": "该 Business Account 可以向此手机号发送。"}, "eligible": {"type": "boolean", "example": false, "description": "当前企业主动发送的消息会被受理。"}, "reason": {"type": "string", "enum": ["ok", "no_relation", "service_window_closed", "suppressed", "verification_required", "not_addressable"], "example": "service_window_closed", "description": "稳定的原因码，绝不暴露姓名、头像、好友关系或号码是否注册。"}}}, "SenderList": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Sender"}}, "paging": {"$ref": "#/components/schemas/Paging"}}}, "Paging": {"type": "object", "properties": {"next_cursor": {"type": "string", "nullable": true, "example": "c2VuZGVyX2lkPXNuZF85"}}}, "Recipient": {"description": "接收方。填写 `to`；若不是手机号，需指定 `to_type`。手机号采用 E.164 格式。", "type": "object"}, "SendMessageRequest": {"type": "object", "required": ["to", "type"], "properties": {"messaging_product": {"type": "string", "enum": ["phiz"], "default": "phiz", "description": "可选；为兼容 Cloud API 而保留。"}, "recipient_type": {"type": "string", "enum": ["individual"], "default": "individual"}, "to": {"type": "string", "example": "+5511987654321", "description": "接收方手机号（E.164）或其在本应用下的 Open ID。手机号会在发送前换取用户的 Open ID。"}, "to_type": {"type": "string", "enum": ["phone", "open_id"], "default": "phone"}, "type": {"type": "string", "enum": ["text", "image", "video", "audio", "document", "location", "interactive", "reaction", "template"], "description": "`template` 预留给后续的 Marketing API。"}, "text": {"$ref": "#/components/schemas/TextContent"}, "image": {"$ref": "#/components/schemas/MediaContent"}, "video": {"$ref": "#/components/schemas/MediaContent"}, "audio": {"$ref": "#/components/schemas/MediaContent"}, "document": {"$ref": "#/components/schemas/MediaContent"}, "location": {"$ref": "#/components/schemas/LocationContent"}, "interactive": {"$ref": "#/compone LocationContent": {"type": "object", "required": ["latitude", "longitude"], "properties": {"latitude": {"type": "number", "example": -23.5614}, "longitude": {"type": "number", "example": -46.6559}, "name": {"type": "string", "example": "Loja Paulista"}, "address": {"type": "string"}}}, "InteractiveContent": {"type": "object", "properties": {"type": {"type": "string", "enum": ["button", "list"]}, "body": {"type": "object", "properties": {"text": {"type": "string"}}}, "action": {"type": "object", "properties": {"buttons": {"type": "array", "maxItems": 3, "items": {"type": "object", "properties": {"type": {"type": "string", "enum": ["reply"]}, "reply": {"type": "object", "properties": {"id": {"type": "string"}, "title": {"type": "string", "maxLength": 20}}}}}}}}}}, "ReactionContent": {"type": "object", "properties": {"message_id": {"type": "string"}, "emoji": {"type": "string", "example": "👍"}}}, "SendMessageResponse": {"type": "object", "properties": {"messaging_product": {"type": "string", "example": "phiz"}, "contacts": {"type": "array", "items": {"type": "object", "properties": {"input": {"type": "string", "example": "+5511987654321"}, "open_id": {"type": "string", "nullable": true, "example": null, "description": "用户在本应用下的 Open ID。仅当用户已与该 Business Account 建立绑定关系时返回。"}}}}, "messages": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string", "example": "pmid.01JA9VZ6T8R3"}, "message_status": {"type": "string", "enum": ["accepted"]}}}}}}, "MessageStatus": {"type": "object", "properties": {"id": {"type": "string", "example": "pmid.01JA9VZ6T8R3"}, "sender_id": {"type": "string", "example": "ba_7Kq2M9xTpL"}, "status": {"type": "string", "enum": ["accepted", "sent", "delivered", "read", "failed"]}, "updated_at": {"type": "string", "format": "date-time"}, "biz_opaque_callback_data": {"type": "string", "nullable": true}, "errors": {"type": "array", "items": {"$ref": "#/components/schemas/ErrorDetail"}}}}, "MarkReadRequest": {"type": "object", "required": ["status", "message_id"], "properties": {"messaging_product": {"type": "string", "enum": ["phiz"]}, "status": {"type": "string", "enum": ["read"]}, "message_id": {"type": "string", "example": "pmid.IN_01JA9W2C"}, "typing_indicator": {"type": "boolean", "default": false}}}, "WebhookConfig": {"type": "object", "required": ["url", "verify_token"], "properties": {"url": {"type": "string", "format": "uri", "example": "https://integracao.lojaexemplo.com.br/phiz/webhook"}, "verify_token": {"type": "string", "writeOnly": true, "example": "um-texto-que-so-voce-conhece", "description": "由您设定，会在 GET 握手时回传。"}, "fields": {"type": "array", "items": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "example": ["messages", "message_status"]}, "status": {"type": "string", "readOnly": true, "enum": ["verified", "pending_verification", "failing", "disabled"]}}}, "WebhookEvent": {"type": "object", "description": "所有事件的外层结构，`entry[].id` 为 BA ID，可批量包含同一 Business Account 的多个事件。", "properties": {"object": {"type": "string", "enum": ["phiz_business_account"]}, "entry": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string", "example": "ba_7Kq2M9xTpL"}, "changes": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string", "enum": ["messages", "message_status", "sender_update", "account_update"]}, "value": {"type": "object"}}}}}}}}}, "ErrorDetail": {"type": "object", "properties": {"code": {"type": "integer", "example": 2104}, "title": {"type": "string", "example": "recipient_not_reachable"}, "message": {"type": "string"}, "href": {"type": "string", "format": "uri"}}}, "OAuthError": {"type": "object", "description": "RFC 6749 §5.2", "properties": {"error": {"type": "string", "enum": ["invalid_request", "invalid_client", "invalid_scope", "unsupported_grant_type"]}, "error_description": {"type": "string", "example": "Client authentication failed."}}}, "Error": {"type": "object", "properties": {"error": {"type": "object", "properties": {"code": {"type": "integer", "example": 1003}, "type": {"type": "string", "example": "invalid_request"}, "message": {"type": "string", "example": "Field 'to' must be E.164 when to_type is 'phone'."}, "details": {"type": "array", "items": {"type": "object", "properties": {"field": {"type": "string"}, "issue": {"type": "string"}}}}, "trace_id": {"type": "string", "example": "trc_9f2c41ab"}}}}}}, "responses": {"BadRequest": {"description": "请求无效。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "Unauthorized": {"description": "令牌缺失、无效或已过期。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}, "example": {"error": {"code": 1101, "type": "unauthorized", "message": "Access token expired.", "trace_id": "trc_1a2b"}}}}}, "Forbidden": {"description": "应用缺少所需范围或无权使用该发送方。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "NotFound": {"description": "资源不存在。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "TooManyRequests": {"description": "超出速率限制，请遵循 Retry-After。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}, "headers": {"Retry-After": {"schema": {"type": "integer"}}}}, "ServerError": {"description": "服务器内部错误，可使用相同的 Idempotency-Key 重试。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}};window.PHIZ_YAML={"pt": "openapi: 3.1.0\ninfo:\n  title: PHIZ Business Messaging API\n  version: 1.0.0-draft\n  description: 'API de mensageria empresarial da PHIZ. Permite que sistemas de terceiros (CRMs, plataformas de atendimento\n    como Blip e Salesforce, ou sistemas próprios do comerciante) enviem mensagens a usuários PHIZ identificados\n    por **número de telefone** ou **Open ID**, e recebam por **webhook** as mensagens de resposta e as mudanças\n    de status.\n\n\n    O formato das mensagens e dos webhooks segue de perto a Cloud API da Meta (WhatsApp Business Platform), para\n    reduzir o custo de adaptação de integrações existentes.\n\n\n    **Status:** proposta (RFC PHZ-0001). Nada aqui está implementado.'\n  contact:\n    name: PHIZ Open Platform\n    url: https://open.phiz.chat\nservers:\n- url: https://{gateway}/gateway/business\n  description: 'Produção: gateway atual da PHIZ, prefixo /gateway/business'\n  variables:\n    gateway:\n      default: gateway.phiz.chat\n      description: Host do gateway de produção (valor ilustrativo).\n- url: https://{gateway}/gateway/business\n  description: 'Sandbox: gateway de testes (Openapi-test), mesmo prefixo'\n  variables:\n    gateway:\n      default: gateway-test.phiz.chat\n      description: Host do gateway de testes (valor ilustrativo).\ntags:\n- name: Auth\n  description: Emissão e revogação de tokens OAuth 2.0 (client credentials).\n- name: Account\n  description: Aplicação, Business Accounts e remetentes.\n- name: Messages\n  description: Envio de mensagens para um número de telefone ou Open ID e consulta de status.\n- name: Media\n  description: Upload de mídia para o armazenamento temporário da PHIZ. Toda mídia enviada em mensagens precisa\n    passar por aqui; links de terceiros não são aceitos.\n- name: Webhooks\n  description: Eventos enviados ao seu servidor. Na Fase 1, o parceiro cadastra a URL em Assinaturas de eventos,\n    na Central do Desenvolvedor; os endpoints de configuração do app (`/v1/apps/{app_id}/webhook…`) são da Fase\n    2.\nsecurity:\n- bearerAuth: []\npaths:\n  /oauth/token:\n    post:\n      tags:\n      - Auth\n      summary: Obter access token\n      description: 'Troca client_id e client_secret por um access token Bearer (OAuth 2.0, RFC 6749 §4.4). Não há\n        refresh token: quando o token expirar, peça outro. Aceita `application/x-www-form-urlencoded` (padrão OAuth)\n        e `application/json`.'\n      operationId: getToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n            example:\n              grant_type: client_credentials\n              client_id: app_2Fk81PzQ\n              client_secret: phzsk_live_9c1f…\n              scope: messages:send messages:read\n      responses:\n        '200':\n          description: Token emitido.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenResponse'\n              example:\n                access_token: eyJhbGciOiJFUzI1NiIs…\n                token_type: Bearer\n                expires_in: 3600\n                scope: messages:send messages:read\n                developer_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        '400':\n          description: Pedido inválido (`invalid_request`, `invalid_scope`, `unsupported_grant_type`).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n        '401':\n          description: Credenciais inválidas (`invalid_client`).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n              example:\n                error: invalid_client\n                error_description: Client authentication failed.\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n  /oauth/revoke:\n    post:\n      tags:\n      - Auth\n      summary: Revogar token\n      description: Revoga um access token antes da expiração (RFC 7009). Sempre responde 200, mesmo se o token já\n        era inválido.\n      operationId: revokeToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              type: object\n              required:\n              - token\n              - client_id\n              - client_secret\n              properties:\n                token:\n                  type: string\n                client_id:\n                  type: string\n                client_secret:\n                  type: string\n      responses:\n        '200':\n          description: OK\n  /v1/me:\n    get:\n      tags:\n      - Auth\n      summary: Inspecionar token atual\n      description: Retorna aplicação, Developer ID, escopos e remetentes (Business Accounts e canais) do token usado.\n        Útil para diagnosticar integrações (equivale ao debug_token da Meta).\n      operationId: getMe\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenInfo'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n  /v1/apps/{app_id}:\n    get:\n      tags:\n      - Account\n      summary: Consultar aplicação\n      description: 'Dados da aplicação do token: Developer ID (antigo Merchant ID), ambiente e status.'\n      operationId: getApp\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/App'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/senders:\n    get:\n      tags:\n      - Account\n      summary: Listar remetentes\n      description: 'Remetentes da aplicação: os Business Accounts criados nela e, se houver, os canais liberados.'\n      operationId: listSenders\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      - name: cursor\n        in: query\n        schema:\n          type: string\n      - name: limit\n        in: query\n        schema:\n          type: integer\n          default: 25\n          maximum: 100\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SenderList'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/senders/{sender_id}:\n    get:\n      tags:\n      - Account\n      summary: Consultar remetente\n      description: Status, limite de envio e qualidade do remetente.\n      operationId: getSender\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'ID do remetente: referência externa mapeada para o BA ID de um Business Account da aplicação\n          (padrão) ou, opcionalmente, o ID de um canal. Não é o merchant_id. Equivale ao phone_number_id da Cloud\n          API da Meta.'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Sender'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/{sender_id}/messages:\n    post:\n      tags:\n      - Messages\n      summary: Enviar mensagem\n      description: 'Envia uma mensagem para um telefone (E.164) ou Open ID, em nome de um Business Account da aplicação\n        (`sender_id` mapeado para o BA ID) ou, opcionalmente, por um canal. O telefone é convertido no Open ID do\n        usuário; o vínculo do Business Account é com o Open ID, não com o número. A resposta `202` só confirma que\n        a mensagem foi aceita; o resultado final (`sent`, `delivered`, `read` ou `failed`) chega pelo webhook `message_status`.\n\n\n        Mensagens iniciadas pelo comerciante seguem a política de opt-in, que será definida por Produto.\n\n\n        O mesmo endpoint com `status: read` marca uma mensagem recebida como lida (compatível com a Cloud API).'\n      operationId: sendMessage\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'ID do remetente: referência externa mapeada para o BA ID de um Business Account da aplicação\n          (padrão) ou, opcionalmente, o ID de um canal. Não é o merchant_id. Equivale ao phone_number_id da Cloud\n          API da Meta.'\n      - name: Idempotency-Key\n        in: header\n        required: false\n        schema:\n          type: string\n          maxLength: 128\n        example: pedido-48213-confirmacao\n        description: Chave única por requisição lógica. Repetir a mesma chave em até 24 h devolve a resposta original\n          sem reenviar a mensagem.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              oneOf:\n              - $ref: '#/components/schemas/SendMessageRequest'\n              - $ref: '#/components/schemas/MarkReadRequest'\n            examples:\n              text_phone:\n                summary: Texto para telefone\n                value:\n                  messaging_product: phiz\n                  to: '+5511987654321'\n                  to_type: phone\n                  type: text\n                  text:\n                    body: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n                    preview_url: false\n                  biz_opaque_callback_data: pedido=48213\n              text_open_id:\n                summary: Texto para Open ID\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: text\n                  text:\n                    body: 'Seu cupom chegou: PHIZ10'\n              image:\n                summary: Imagem pelo id da mídia\n                value:\n                  to: '+5511987654321'\n                  type: image\n                  image:\n                    id: pmed.01JB2K3H2D\n                    caption: Nota fiscal\n              audio:\n                summary: Áudio pelo id da mídia\n                value:\n                  to: '+5511987654321'\n                  type: audio\n                  audio:\n                    id: pmed.01JB2K4M7A\n              video:\n                summary: Vídeo pelo link PHIZ\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: video\n                  video:\n                    link: https://media.phiz.chat/biz/pmed.01JB2K5V1C\n                    caption: Como montar seu produto\n              document:\n                summary: Documento\n                value:\n                  to: '+5511987654321'\n                  type: document\n                  document:\n                    id: pmed.01JB2K7Q9X\n                    filename: nota-fiscal-48213.pdf\n                    caption: 'Nota fiscal do pedido #48213'\n              buttons:\n                summary: Botões de resposta\n                value:\n                  to: '+5511987654321'\n                  type: interactive\n                  interactive:\n                    type: button\n                    body:\n                      text: Confirma a entrega amanhã entre 9h e 12h?\n                    action:\n                      buttons:\n                      - type: reply\n                        reply:\n                          id: confirmar\n                          title: Confirmar\n                      - type: reply\n                        reply:\n                          id: reagendar\n                          title: Reagendar\n              mark_read:\n                summary: Marcar como lida\n                value:\n                  messaging_product: phiz\n                  status: read\n                  message_id: pmid.IN_01JA9W2C\n      responses:\n        '202':\n          description: Mensagem aceita para envio.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SendMessageResponse'\n              example:\n                messaging_product: phiz\n                contacts:\n                - input: '+5511987654321'\n                  open_id: null\n                messages:\n                - id: pmid.01JA9VZ6T8R3\n                  message_status: accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n
