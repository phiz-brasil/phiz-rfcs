 $ref: '#/components/responses/ServerError'\n        '409':\n          description: Idempotency-Key reutilizada com corpo diferente.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '422':\n          description: Envio não permitido pela política de opt-in (2201), tipo não permitido (2202), fora da janela\n            de atendimento (2203), template não aprovado (2204), horário ou região restritos (2205), ou mídia expirada\n            (2303).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              example:\n                error:\n                  code: 2201\n                  type: policy_violation\n                  message: Sending to this recipient is not allowed by the opt-in policy.\n                  trace_id: trc_77ac\n  /v1/{sender_id}/recipients/resolve:\n    post:\n      tags:\n      - Messages\n      summary: Resolver destinatário (proposta)\n      description: '**Proposta do PHZ-BM-0001, em aberto (Q18).** Diz se o Business Account pode enviar para o telefone\n        agora, sem revelar se o número tem conta PHIZ. Requer o escopo `recipients:resolve` e relação com o usuário.'\n      operationId: resolveRecipient\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'ID do remetente: referência externa mapeada para o BA ID de um Business Account da aplicação\n          (padrão) ou, opcionalmente, o ID de um canal. Não é o merchant_id. Equivale ao phone_number_id da Cloud\n          API da Meta.'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ResolveRequest'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResolveResponse'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/{sender_id}/media:\n    post:\n      tags:\n      - Media\n      summary: Enviar mídia (upload)\n      description: 'Envia um arquivo para o armazenamento temporário da PHIZ e devolve `id` e `link` para usar no\n        envio. Formato e tamanho são checados aqui: fora da tabela da seção 09, responde 415 (2304) ou 413 (2305).\n\n\n        O arquivo fica disponível até `expires_at` (proposta: 30 dias) e pode ser usado em vários envios de remetentes\n        da mesma aplicação. Requer o escopo `messages:send`.'\n      operationId: uploadMedia\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'ID do remetente: referência externa mapeada para o BA ID de um Business Account da aplicação\n          (padrão) ou, opcionalmente, o ID de um canal. Não é o merchant_id. Equivale ao phone_number_id da Cloud\n          API da Meta.'\n      requestBody:\n        required: true\n        content:\n          multipart/form-data:\n            schema:\n              $ref: '#/components/schemas/MediaUploadRequest'\n      responses:\n        '200':\n          description: Mídia armazenada.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '413':\n          description: Arquivo acima do tamanho máximo do tipo (2305).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '415':\n          description: Formato não aceito (2304).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /v1/media/{media_id}:\n    get:\n      tags:\n      - Media\n      summary: Consultar mídia\n      description: Link, tipo, tamanho e validade de uma mídia enviada por upload.\n      operationId: getMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n    delete:\n      tags:\n      - Media\n      summary: Remover mídia\n      description: Apaga a mídia antes do prazo. Envios que ainda usem o `id` ou o `link` falham com 2303.\n      operationId: deleteMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '204':\n          description: Mídia removida.\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/messages/{message_id}:\n    get:\n      tags:\n      - Messages\n      summary: Consultar status da mensagem\n      description: Último status conhecido de uma mensagem enviada. Use como contingência; o webhook continua sendo\n        a fonte principal. Dados retidos por 30 dias.\n      operationId: getMessage\n      parameters:\n      - name: message_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/MessageStatus'\n              example:\n                id: pmid.01JA9VZ6T8R3\n                sender_id: '1231'\n                status: delivered\n                updated_at: '2026-10-15T11:42:07Z'\n                biz_opaque_callback_data: pedido=48213\n                errors: []\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/webhook:\n    get:\n      tags:\n      - Webhooks\n      summary: Consultar webhook\n      description: '**Fase 2.** Configuração e saúde da assinatura de webhook do app.'\n      operationId: getWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n    put:\n      tags:\n      - Webhooks\n      summary: Configurar webhook\n      description: '**Fase 2.** Define URL, verify_token e eventos. A PHIZ faz o handshake GET na URL antes de ativar;\n        se falhar, responde 422. Na Fase 1, o parceiro cadastra a URL em Assinaturas de eventos.'\n      operationId: setWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookConfig'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '422':\n          description: Handshake de verificação falhou.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n    delete:\n      tags:\n      - Webhooks\n      summary: Remover webhook\n      description: '**Fase 2.** Para de enviar eventos para o app.'\n      operationId: deleteWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      responses:\n        '204':\n          description: No Content\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/test:\n    post:\n      tags:\n      - Webhooks\n      summary: Enviar evento de teste\n      description: '**Fase 2.** Dispara um evento `messages` de exemplo, assinado, para a URL configurada.'\n      operationId: testWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                field:\n                  type: string\n                  enum:\n                  - messages\n                  - message_status\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries:\n    get:\n      tags:\n      - Webhooks\n      summary: Listar entregas de webhook\n      description: '**Fase 2.** Histórico das últimas 72 h com status HTTP, tentativas e latência. Permite reenviar\n        entregas que falharam.'\n      operationId: listDeliveries\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      - name: status\n        in: query\n        schema:\n          type: string\n          enum:\n          - succeeded\n          - failed\n          - pending\n      responses:\n        '200':\n          description: OK\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries/{delivery_id}/replay:\n    post:\n      tags:\n      - Webhooks\n      summary: Reenviar entrega\n      description: '**Fase 2.** Reenvia um evento com o mesmo `X-Phiz-Delivery-Id`.'\n      operationId: replayDelivery\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: ID do app de desenvolvedor.\n      - name: delivery_id\n        in: path\n        required: true\n        schema:\n          type: string\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\nwebhooks:\n  verification:\n    get:\n      tags:\n      - Webhooks\n      summary: Handshake de verificação (GET no seu servidor)\n      description: A PHIZ chama sua URL com `hub.mode=subscribe`, `hub.verify_token` e `hub.challenge`. Confira\n        o token e responda 200 com o valor de `hub.challenge` em texto puro.\n      parameters:\n      - name: hub.mode\n        in: query\n        schema:\n          type: string\n          enum:\n          - subscribe\n      - name: hub.verify_token\n        in: query\n        schema:\n          type: string\n      - name: hub.challenge\n        in: query\n        schema:\n          type: string\n        example: '1158201444'\n      responses:\n        '200':\n          description: Corpo = hub.challenge.\n          content:\n            text/plain:\n              schema:\n                type: string\n              example: '1158201444'\n  messages:\n    post:\n      tags:\n      - Webhooks\n      summary: Mensagem recebida do usuário\n      description: Enviado quando um usuário PHIZ manda mensagem para um Business Account ou canal da aplicação.\n        `from` é o Open ID do usuário nesta aplicação. Responda 2xx em até 10 s e processe de forma assíncrona.\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: HMAC-SHA256 de `{timestamp}.{corpo bruto}` com o webhook secret do app.\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: Unix epoch do envio. Rejeite se diferir mais de 5 min.\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: Igual em todas as tentativas do mesmo evento. Use para descartar duplicados.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            example:\n              object: phiz_business_account\n              entry:\n              - id: ba_7Kq2M9xTpL\n                changes:\n                - field: messages\n                  value:\n                    messaging_product: phiz\n                    metadata:\n                      sender_id: ba_7Kq2M9xTpL\n                      sender_type: business_account\n                      conversation_type: business_account\n                      display_name: Loja Exemplo\n                    contacts:\n                    - profile:\n                        name: Maria Souza\n                      open_id: oid_Qm7f2K9xT4Lw\n                      phone: '+5511987654321'\n                    messages:\n                    - from: oid_Qm7f2K9xT4Lw\n                      id: pmid.IN_01JA9W2C\n                      timestamp: '1760528527'\n                      type: text\n                      text:\n                        body: Quero reagendar a entrega\n                      context:\n                        id: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n  message_status:\n    post:\n      tags:\n      - Webhooks\n      summary: Mudança de status de mensagem enviada\n      description: 'Um evento por transição: `sent` → `delivered` → `read`, ou `failed` com `errors`. A ordem de\n        chegada não é garantida; use `timestamp`.'\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: HMAC-SHA256 de `{timestamp}.{corpo bruto}` com o webhook secret do app.\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: Unix epoch do envio. Rejeite se diferir mais de 5 min.\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: Igual em todas as tentativas do mesmo evento. Use para descartar duplicados.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            examples:\n              delivered:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9VZ6T8R3\n                          status: delivered\n                          timestamp: '1760528410'\n                          recipient_id: oid_Qm7f2K9xT4Lw\n                          biz_opaque_callback_data: pedido=48213\n                          conversation:\n                            id: conv_01JA9W\n                            origin:\n                              type: service\n                            expires_at: '1760614810'\n              failed:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9X0QW1\n                          status: failed\n                          timestamp: '1760528600'\n                          recipient_id: '+5511900000000'\n                          errors:\n                          - code: 2104\n                            title: recipient_not_reachable\n                            message: The phone number is not linked to a PHIZ account or blocked this sender.\n                            href: https://developers.phiz.chat/docs/errors#2104\n      responses:\n        '200':\n          description: OK\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n    oauth2:\n      type: oauth2\n      flows:\n        clientCredentials:\n          tokenUrl: https://gateway.phiz.chat/gateway/business/oauth/token\n          scopes:\n            messages:send: Enviar mensagens de serviço e mídias\n            messages:read: Ler status de mensagens\n            webhooks:manage: Gerenciar webhook do app (Fase 2)\n            account:read: Ler aplicação, Business Accounts e canais\n            templates:manage: Reservado para a Marketing API\n            recipients:resolve: Resolver destinatário (proposta)\n            messages:send_marketing: Enviar marketing (reservado)\n  schemas:\n    TokenRequest:\n      type: object\n      required:\n      - grant_type\n      - client_id\n      - client_secret\n      properties:\n        grant_type:\n          type: string\n          enum:\n          - client_credentials\n        client_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: ID do app (client_id) gerado na Central do Desenvolvedor.\n        client_secret:\n          type: string\n          format: password\n          example: phzsk_live_9c1f…\n          description: Secret do app. Exibido uma única vez na criação ou rotação.\n        scope:\n          type: string\n          example: messages:send messages:read\n          description: Escopos solicitados, separados por espaço. Se omitido, recebe todos os escopos concedidos\n            ao app.\n    TokenResponse:\n      type: object\n      required:\n      - access_token\n      - token_type\n      - expires_in\n      - scope\n      properties:\n        access_token:\n          type: string\n          example: eyJhbGciOiJFUzI1NiIsImtpZCI6InBoei0yMDI2LTEwIn0…\n        token_type:\n          type: string\n          enum:\n          - Bearer\n        expires_in:\n          type: integer\n          example: 3600\n          description: Validade em segundos.\n        scope:\n          type: string\n          example: messages:send messages:read webhooks:manage\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n    TokenInfo:\n      type: object\n      properties:\n        active:\n          type: boolean\n          example: true\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        scope:\n          type: string\n          example: messages:send messages:read\n        senders:\n          type: array\n          items:\n            type: string\n          example:\n          - ba_7Kq2M9xTpL\n          - '1231'\n          description: Remetentes que este app pode usar.\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-10-15T12:30:00Z'\n    App:\n      type: object\n      properties:\n        id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n          description: 'Developer ID: a organização dona dos recursos. É o antigo Merchant ID com nome unificado,\n            não uma entidade separada.'\n        name:\n          type: string\n          example: Blip · Atendimento\n        environment:\n          type: string\n          enum:\n          - test\n          - sandbox\n          - production\n        status:\n          type: string\n          enum:\n          - running\n          - in_review\n          - disabled\n    Sender:\n      type: object\n      properties:\n        id:\n          type: string\n          example: ba_7Kq2M9xTpL\n          description: sender_id usado na rota. Para Business Account, mapeado 1:1 para o BA ID.\n        type:\n          type: string\n          enum:\n          - business_account\n          - channel\n          example: business_account\n          description: '`business_account`: Business Account criado na aplicação (padrão). `channel`: um canal do\n            comerciante, opcional.'\n        ba_id:\n          type: string\n          nullable: true\n          example: ba_7Kq2M9xTpL\n          description: Preenchido quando type = business_account.\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: Aplicação dona do Business Account.\n        conversation_type:\n          type: string\n          enum:\n          - business_account\n          - channel_service\n          example: business_account\n          description: 'Tipo de conversa no PhizChat: `business_account` (produto exibido ao usuário, dentro de\n            Conversa de serviço empresarial › Conversa de conta pública) ou `channel_service`.'\n        display_name:\n          type: string\n          example: Loja Exemplo\n        channel_id:\n          type: string\n          nullable: true\n          example: null\n          description: Preenchido apenas quando type = channel.\n        status:\n          type: string\n          enum:\n          - connected\n          - pending_review\n          - disabled\n        messaging_limit_tier:\n          type: string\n          example: TIER_1K\n          description: Quantos destinatários únicos podem receber mensagens iniciadas pela empresa em 24 h.\n        quality_rating:\n          type: string\n          enum:\n          - GREEN\n          - YELLOW\n          - RED\n          - UNKNOWN\n    ResolveRequest:\n      type: object\n      required:\n      - phone\n      properties:\n        phone:\n          type: string\n          example: '+5511987654321'\n          description: Telefone em E.164.\n    ResolveResponse:\n      type: object\n      properties:\n        addressable:\n          type: boolean\n          example: true\n          description: O Business Account pode endereçar esse telefone.\n        eligible:\n          type: boolean\n          example: false\n          description: Uma mensagem iniciada pela empresa seria aceita agora.\n        reason:\n          type: string\n          enum:\n          - ok\n          - no_relation\n          - service_window_closed\n          - suppressed\n          - verification_required\n          - not_addressable\n          example: service_window_closed\n          description: Motivo estável. Nunca revela nome, foto, amizade ou se o número tem cadastro.\n    SenderList:\n      type: object\n      properties:\n        data:\n          type: array\n          items:\n            $ref: '#/components/schemas/Sender'\n        paging:\n          $ref: '#/components/schemas/Paging'\n    Paging:\n      type: object\n      properties:\n        next_cursor:\n          type: string\n          nullable: true\n          example: c2VuZGVyX2lkPXNuZF85\n    Recipient:\n      description: Destinatário. Informe `to` e, se não for telefone, `to_type`. Telefone em formato E.164.\n      type: object\n    SendMessageRequest:\n      type: object\n      required:\n      - to\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n          default: phiz\n          description: Opcional; mantido por compatibilidade com a Cloud API.\n        recipient_type:\n          type: string\n          enum:\n          - individual\n          default: individual\n        to:\n          type: string\n          example: '+5511987654321'\n          description: Telefone E.164 ou Open ID do destinatário nesta aplicação. O telefone é convertido no Open\n            ID do usuário antes do envio.\n        to_type:\n          type: string\n          enum:\n          - phone\n          - open_id\n          default: phone\n        type:\n          type: string\n          enum:\n          - text\n          - image\n          - video\n          - audio\n          - document\n          - location\n          - interactive\n          - reaction\n          - template\n          description: '`template` fica reservado para a futura Marketing API.'\n        text:\n          $ref: '#/components/schemas/TextContent'\n        image:\n          $ref: '#/components/schemas/MediaContent'\n        video:\n          $ref: '#/components/schemas/MediaContent'\n        audio:\n          $ref: '#/components/schemas/MediaContent'\n        document:\n          $ref: '#/components/schemas/MediaContent'\n        location:\n          $ref: '#/components/schemas/LocationContent'\n        interactive:\n          $ref: '#/components/schemas/InteractiveContent'\n        reaction:\n          $ref: '#/components/schemas/ReactionContent'\n        context:\n          type: object\n          properties:\n            message_id:\n              type: string\n          description: Responde (cita) uma mensagem anterior.\n        biz_opaque_callback_data:\n          type: string\n          maxLength: 512\n          example: pedido=48213\n          description: Texto livre devolvido em todos os webhooks de status desta mensagem.\n    TextContent:\n      type: object\n      required:\n      - body\n      properties:\n        body:\n          type: string\n          maxLength: 4096\n          example: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n        preview_url:\n          type: boolean\n          default: false\n    MediaContent:\n      type: object\n      description: Informe `id` (recomendado) ou `link`, ambos devolvidos pelo upload em `POST /v1/{sender_id}/media`.\n      anyOf:\n      - required:\n        - id\n      - required:\n        - link\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n          description: ID da mídia devolvido pelo upload. Válido até `expires_at`.\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n          description: Link PHIZ devolvido pelo upload. URLs de terceiros são recusadas com erro 2302.\n        caption:\n          type: string\n          maxLength: 1024\n          description: Não se aplica a áudio.\n        filename:\n          type: string\n          description: Só para document.\n    MediaUploadRequest:\n      type: object\n      required:\n      - file\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        type:\n          type: string\n          example: application/pdf\n          description: Tipo MIME do arquivo. Precisa estar na tabela de formatos da seção 09.\n        file:\n          type: string\n          format: binary\n    Media:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n        mime_type:\n          type: string\n          example: application/pdf\n        file_size:\n          type: integer\n          example: 184320\n        sha256:\n          type: string\n          example: 9b1f…\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-11-19T14:00:00Z'\n          description: 'Fim do armazenamento temporário (proposta: 30 dias após o upload). Depois disso, `id` e\n            `link` deixam de valer.'\n    LocationContent:\n      type: object\n      required:\n      - latitude\n      - longitude\n      properties:\n        latitude:\n          type: number\n          example: -23.5614\n        longitude:\n          type: number\n          example: -46.6559\n        name:\n          type: string\n          example: Loja Paulista\n        address:\n          type: string\n    InteractiveContent:\n      type: object\n      properties:\n        type:\n          type: string\n          enum:\n          - button\n          - list\n        body:\n          type: object\n          properties:\n            text:\n              type: string\n        action:\n          type: object\n          properties:\n            buttons:\n              type: array\n              maxItems: 3\n              items:\n                type: object\n                properties:\n                  type:\n                    type: string\n                    enum:\n                    - reply\n                  reply:\n                    type: object\n                    properties:\n                      id:\n                        type: string\n                      title:\n                        type: string\n                        maxLength: 20\n    ReactionContent:\n      type: object\n      properties:\n        message_id:\n          type: string\n        emoji:\n          type: string\n          example: 👍\n    SendMessageResponse:\n      type: object\n      properties:\n        messaging_product:\n          type: string\n          example: phiz\n        contacts:\n          type: array\n          items:\n            type: object\n            properties:\n              input:\n                type: string\n                example: '+5511987654321'\n              open_id:\n                type: string\n                nullable: true\n                example: null\n                description: Open ID do usuário nesta aplicação. Preenchido apenas se o usuário já tem vínculo com\n                  este Business Account.\n        messages:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: pmid.01JA9VZ6T8R3\n              message_status:\n                type: string\n                enum:\n                - accepted\n    MessageStatus:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmid.01JA9VZ6T8R3\n        sender_id:\n          type: string\n          example: ba_7Kq2M9xTpL\n        status:\n          type: string\n          enum:\n          - accepted\n          - sent\n          - delivered\n          - read\n          - failed\n        updated_at:\n          type: string\n          format: date-time\n        biz_opaque_callback_data:\n          type: string\n          nullable: true\n        errors:\n          type: array\n          items:\n            $ref: '#/components/schemas/ErrorDetail'\n    MarkReadRequest:\n      type: object\n      required:\n      - status\n      - message_id\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        status:\n          type: string\n          enum:\n          - read\n        message_id:\n          type: string\n          example: pmid.IN_01JA9W2C\n        typing_indicator:\n          type: boolean\n          default: false\n    WebhookConfig:\n      type: object\n      required:\n      - url\n      - verify_token\n      properties:\n        url:\n          type: string\n          format: uri\n          example: https://integracao.lojaexemplo.com.br/phiz/webhook\n        verify_token:\n          type: string\n          writeOnly: true\n          example: um-texto-que-so-voce-conhece\n          description: Texto definido por você e devolvido no handshake GET.\n        fields:\n          type: array\n          items:\n            type: string\n            enum:\n            - messages\n            - message_status\n            - sender_update\n            - account_update\n          example:\n          - messages\n          - message_status\n        status:\n          type: string\n          readOnly: true\n          enum:\n          - verified\n          - pending_verification\n          - failing\n          - disabled\n    WebhookEvent:\n      type: object\n      description: Envelope de todos os eventos. `entry[].id` é o BA ID. Pode agrupar vários eventos do mesmo Business\n        Account.\n      properties:\n        object:\n          type: string\n          enum:\n          - phiz_business_account\n        entry:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: ba_7Kq2M9xTpL\n              changes:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    field:\n                      type: string\n                      enum:\n                      - messages\n                      - message_status\n                      - sender_update\n                      - account_update\n                    value:\n                      type: object\n    ErrorDetail:\n      type: object\n      properties:\n        code:\n          type: integer\n          example: 2104\n        title:\n          type: string\n          example: recipient_not_reachable\n        message:\n          type: string\n        href:\n          type: string\n          format: uri\n    OAuthError:\n      type: object\n      description: RFC 6749 §5.2\n      properties:\n        error:\n          type: string\n          enum:\n          - invalid_request\n          - invalid_client\n          - invalid_scope\n          - unsupported_grant_type\n        error_description:\n          type: string\n          example: Client authentication failed.\n    Error:\n      type: object\n      properties:\n        error:\n          type: object\n          properties:\n            code:\n              type: integer\n              example: 1003\n            type:\n              type: string\n              example: invalid_request\n            message:\n              type: string\n              example: Field 'to' must be E.164 when to_type is 'phone'.\n            details:\n              type: array\n              items:\n                type: object\n                properties:\n                  field:\n                    type: string\n                  issue:\n                    type: string\n            trace_id:\n              type: string\n              example: trc_9f2c41ab\n  responses:\n    BadRequest:\n      description: Requisição inválida.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    Unauthorized:\n      description: Token ausente, inválido ou expirado.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            error:\n              code: 1101\n              type: unauthorized\n              message: Access token expired.\n              trace_id: trc_1a2b\n    Forbidden:\n      description: A integração não tem o escopo ou acesso ao remetente.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    NotFound:\n      description: Recurso não encontrado.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    TooManyRequests:\n      description: Limite de requisições atingido. Respeite Retry-After.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n      headers:\n        Retry-After:\n          schema:\n            type: integer\n    ServerError:\n      description: Erro interno. Pode ser repetido com a mesma Idempotency-Key.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n", "en": "openapi: 3.1.0\ninfo:\n  title: PHIZ Business Messaging API\n  version: 1.0.0-draft\n  description: 'PHIZ business messaging API. It lets third-party systems (CRMs, customer-service platforms such\n    as Blip and Salesforce, or the merchant''s own systems) send messages to PHIZ users identified by **phone number**\n    or **Open ID**, and receive replies and status changes through a **webhook**.\n\n\n    Message and webhook payloads closely follow Meta''s Cloud API (WhatsApp Business Platform) to keep the cost\n    of adapting existing integrations low.\n\n\n    **Status:** proposal (RFC PHZ-0001). Nothing here is implemented yet.'\n  contact:\n    name: PHIZ Open Platform\n    url: https://open.phiz.chat\nservers:\n- url: https://{gateway}/gateway/business\n  description: 'Production: current PHIZ gateway, /gateway/business prefix'\n  variables:\n    gateway:\n      default: gateway.phiz.chat\n      description: Production gateway host (illustrative value).\n- url: https://{gateway}/gateway/business\n  description: 'Sandbox: test gateway (Openapi-test), same prefix'\n  variables:\n    gateway:\n      default: gateway-test.phiz.chat\n      description: Test gateway host (illustrative value).\ntags:\n- name: Auth\n  description: OAuth 2.0 token issuance and revocation (client credentials).\n- name: Account\n  description: Application, Business Accounts and senders.\n- name: Messages\n  description: Send messages to a phone number or Open ID and query their status.\n- name: Media\n  description: Media upload to PHIZ temporary storage. All media sent in messages must go through here; third-party\n    links are not accepted.\n- name: Webhooks\n  description: Events delivered to your server. In Phase 1, the partner registers the webhook URL under Event subscriptions\n    in the Developer Center; the app setup endpoints (`/v1/apps/{app_id}/webhook…`) belong to Phase 2.\nsecurity:\n- bearerAuth: []\npaths:\n  /oauth/token:\n    post:\n      tags:\n      - Auth\n      summary: Get access token\n      description: 'Exchanges client_id and client_secret for a Bearer access token (OAuth 2.0, RFC 6749 §4.4).\n        There is no refresh token: when the token expires, request a new one. Accepts `application/x-www-form-urlencoded`\n        (OAuth standard) and `application/json`.'\n      operationId: getToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n            example:\n              grant_type: client_credentials\n              client_id: app_2Fk81PzQ\n              client_secret: phzsk_live_9c1f…\n              scope: messages:send messages:read\n      responses:\n        '200':\n          description: Token issued.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenResponse'\n              example:\n                access_token: eyJhbGciOiJFUzI1NiIs…\n                token_type: Bearer\n                expires_in: 3600\n                scope: messages:send messages:read\n                developer_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        '400':\n          description: Invalid request (`invalid_request`, `invalid_scope`, `unsupported_grant_type`).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n        '401':\n          description: Invalid credentials (`invalid_client`).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n              example:\n                error: invalid_client\n                error_description: Client authentication failed.\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n  /oauth/revoke:\n    post:\n      tags:\n      - Auth\n      summary: Revoke token\n      description: Revokes an access token before it expires (RFC 7009). Always returns 200, even if the token was\n        already invalid.\n      operationId: revokeToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              type: object\n              required:\n              - token\n              - client_id\n              - client_secret\n              properties:\n                token:\n                  type: string\n                client_id:\n                  type: string\n                client_secret:\n                  type: string\n      responses:\n        '200':\n          description: OK\n  /v1/me:\n    get:\n      tags:\n      - Auth\n      summary: Inspect current token\n      description: Returns the application, Developer ID, scopes and senders (Business Accounts and channels) of\n        the token in use. Useful to debug integrations (equivalent to Meta's debug_token).\n      operationId: getMe\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenInfo'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n  /v1/apps/{app_id}:\n    get:\n      tags:\n      - Account\n      summary: Get application\n      description: 'Details of the token''s application: Developer ID (former Merchant ID), environment and status.'\n      operationId: getApp\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/App'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/senders:\n    get:\n      tags:\n      - Account\n      summary: List senders\n      description: 'The application''s senders: the Business Accounts created in it and, if any, the allowed channels.'\n      operationId: listSenders\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      - name: cursor\n        in: query\n        schema:\n          type: string\n      - name: limit\n        in: query\n        schema:\n          type: integer\n          default: 25\n          maximum: 100\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SenderList'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/senders/{sender_id}:\n    get:\n      tags:\n      - Account\n      summary: Get sender\n      description: Sender status, messaging limit and quality.\n      operationId: getSender\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'Sender ID: external reference mapped to the BA ID of one of the application''s Business Accounts\n          (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API''s\n          phone_number_id.'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Sender'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/{sender_id}/messages:\n    post:\n      tags:\n      - Messages\n      summary: Send message\n      description: 'Sends a message to a phone number (E.164) or Open ID, on behalf of one of the application''s\n        Business Accounts (`sender_id` mapped to the BA ID) or, optionally, through a channel. The phone number\n        is converted to the user''s Open ID; the Business Account is bound to the Open ID, not to the number. The\n        `202` response only confirms the message was accepted; the final outcome (`sent`, `delivered`, `read` or\n        `failed`) arrives through the `message_status` webhook.\n\n\n        Merchant-initiated messages follow the opt-in policy, to be defined by Product.\n\n\n        The same endpoint with `status: read` marks an inbound message as read (Cloud API compatible).'\n      operationId: sendMessage\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'Sender ID: external reference mapped to the BA ID of one of the application''s Business Accounts\n          (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API''s\n          phone_number_id.'\n      - name: Idempotency-Key\n        in: header\n        required: false\n        schema:\n          type: string\n          maxLength: 128\n        example: pedido-48213-confirmacao\n        description: Unique key per logical request. Reusing the same key within 24 h returns the original response\n          without sending the message again.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              oneOf:\n              - $ref: '#/components/schemas/SendMessageRequest'\n              - $ref: '#/components/schemas/MarkReadRequest'\n            examples:\n              text_phone:\n                summary: Text to phone number\n                value:\n                  messaging_product: phiz\n                  to: '+5511987654321'\n                  to_type: phone\n                  type: text\n                  text:\n                    body: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n                    preview_url: false\n                  biz_opaque_callback_data: pedido=48213\n              text_open_id:\n                summary: Text to Open ID\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: text\n                  text:\n                    body: 'Seu cupom chegou: PHIZ10'\n              image:\n                summary: Image by media id\n                value:\n                  to: '+5511987654321'\n                  type: image\n                  image:\n                    id: pmed.01JB2K3H2D\n                    caption: Nota fiscal\n              audio:\n                summary: Audio by media id\n                value:\n                  to: '+5511987654321'\n                  type: audio\n                  audio:\n                    id: pmed.01JB2K4M7A\n              video:\n                summary: Video by PHIZ link\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: video\n                  video:\n                    link: https://media.phiz.chat/biz/pmed.01JB2K5V1C\n                    caption: Como montar seu produto\n              document:\n                summary: Document\n                value:\n                  to: '+5511987654321'\n                  type: document\n                  document:\n                    id: pmed.01JB2K7Q9X\n                    filename: nota-fiscal-48213.pdf\n                    caption: 'Nota fiscal do pedido #48213'\n              buttons:\n                summary: Reply buttons\n                value:\n                  to: '+5511987654321'\n                  type: interactive\n                  interactive:\n                    type: button\n                    body:\n                      text: Confirma a entrega amanhã entre 9h e 12h?\n                    action:\n                      buttons:\n                      - type: reply\n                        reply:\n                          id: confirmar\n                          title: Confirmar\n                      - type: reply\n                        reply:\n                          id: reagendar\n                          title: Reagendar\n              mark_read:\n                summary: Mark as read\n                value:\n                  messaging_product: phiz\n                  status: read\n                  message_id: pmid.IN_01JA9W2C\n      responses:\n        '202':\n          description: Message accepted for delivery.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SendMessageResponse'\n              example:\n                messaging_product: phiz\n                contacts:\n                - input: '+5511987654321'\n                  open_id: null\n                messages:\n                - id: pmid.01JA9VZ6T8R3\n                  message_status: accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '409':\n          description: Idempotency-Key reused with a different body.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '422':\n          description: Sending not allowed by the opt-in policy (2201), type not allowed (2202), outside the service\n            window (2203), template not approved (2204), restricted time or region (2205), or media expired (2303).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              example:\n                error:\n                  code: 2201\n                  type: policy_violation\n                  message: Sending to this recipient is not allowed by the opt-in policy.\n                  trace_id: trc_77ac\n  /v1/{sender_id}/recipients/resolve:\n    post:\n      tags:\n      - Messages\n      summary: Resolve recipient (proposal)\n      description: '**Proposal from PHZ-BM-0001, open (Q18).** Tells whether the Business Account can send to the\n        phone number now, without revealing whether the number has a PHIZ account. Requires the `recipients:resolve`\n        scope and a relation with the user.'\n      operationId: resolveRecipient\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'Sender ID: external reference mapped to the BA ID of one of the application''s Business Accounts\n          (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API''s\n          phone_number_id.'\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ResolveRequest'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResolveResponse'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/{sender_id}/media:\n    post:\n      tags:\n      - Media\n      summary: Upload media\n      description: 'Uploads a file to PHIZ temporary storage and returns the `id` and `link` to use when sending.\n        Format and size are checked here: outside the table in section 09, it answers 415 (2304) or 413 (2305).\n\n\n        The file stays available until `expires_at` (proposed: 30 days) and can be used in many sends by senders\n        of the same application. Requires the `messages:send` scope.'\n      operationId: uploadMedia\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 'Sender ID: external reference mapped to the BA ID of one of the application''s Business Accounts\n          (default) or, optionally, the ID of a channel. It is not the merchant_id. Equivalent to Meta Cloud API''s\n          phone_number_id.'\n      requestBody:\n        required: true\n        content:\n          multipart/form-data:\n            schema:\n              $ref: '#/components/schemas/MediaUploadRequest'\n      responses:\n        '200':\n          description: Media stored.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '413':\n          description: File above the maximum size for its type (2305).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '415':\n          description: Format not accepted (2304).\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /v1/media/{media_id}:\n    get:\n      tags:\n      - Media\n      summary: Get media\n      description: Link, type, size and expiry of an uploaded media file.\n      operationId: getMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n    delete:\n      tags:\n      - Media\n      summary: Delete media\n      description: Deletes the media before it expires. Sends that still use the `id` or `link` fail with 2303.\n      operationId: deleteMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '204':\n          description: Media deleted.\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/messages/{message_id}:\n    get:\n      tags:\n      - Messages\n      summary: Get message status\n      description: Latest known status of a sent message. Use as a fallback; the webhook remains the primary source.\n        Data retained for 30 days.\n      operationId: getMessage\n      parameters:\n      - name: message_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/MessageStatus'\n              example:\n                id: pmid.01JA9VZ6T8R3\n                sender_id: '1231'\n                status: delivered\n                updated_at: '2026-10-15T11:42:07Z'\n                biz_opaque_callback_data: pedido=48213\n                errors: []\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/webhook:\n    get:\n      tags:\n      - Webhooks\n      summary: Get webhook\n      description: '**Phase 2.** App webhook subscription settings and health.'\n      operationId: getWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n    put:\n      tags:\n      - Webhooks\n      summary: Set webhook\n      description: '**Phase 2.** Sets URL, verify_token and events. PHIZ performs the GET handshake on the URL before\n        activating; if it fails, returns 422. In Phase 1, the partner registers the URL under Event subscriptions.'\n      operationId: setWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookConfig'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '422':\n          description: Verification handshake failed.\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n    delete:\n      tags:\n      - Webhooks\n      summary: Remove webhook\n      description: '**Phase 2.** Stops delivering events to the app.'\n      operationId: deleteWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      responses:\n        '204':\n          description: No Content\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/test:\n    post:\n      tags:\n      - Webhooks\n      summary: Send test event\n      description: '**Phase 2.** Fires a signed sample `messages` event to the configured URL.'\n      operationId: testWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                field:\n                  type: string\n                  enum:\n                  - messages\n                  - message_status\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries:\n    get:\n      tags:\n      - Webhooks\n      summary: List webhook deliveries\n      description: '**Phase 2.** History of the last 72 h with HTTP status, attempts and latency. Failed deliveries\n        can be replayed.'\n      operationId: listDeliveries\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      - name: status\n        in: query\n        schema:\n          type: string\n          enum:\n          - succeeded\n          - failed\n          - pending\n      responses:\n        '200':\n          description: OK\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries/{delivery_id}/replay:\n    post:\n      tags:\n      - Webhooks\n      summary: Replay delivery\n      description: '**Phase 2.** Re-sends an event with the same `X-Phiz-Delivery-Id`.'\n      operationId: replayDelivery\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: Developer app ID.\n      - name: delivery_id\n        in: path\n        required: true\n        schema:\n          type: string\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\nwebhooks:\n  verification:\n    get:\n      tags:\n      - Webhooks\n      summary: Verification handshake (GET on your server)\n      description: PHIZ calls your URL with `hub.mode=subscribe`, `hub.verify_token` and `hub.challenge`. Check\n        the token and answer 200 with the `hub.challenge` value as plain text.\n      parameters:\n      - name: hub.mode\n        in: query\n        schema:\n          type: string\n          enum:\n          - subscribe\n      - name: hub.verify_token\n        in: query\n        schema:\n          type: string\n      - name: hub.challenge\n        in: query\n        schema:\n          type: string\n        example: '1158201444'\n      responses:\n        '200':\n          description: Body = hub.challenge.\n          content:\n            text/plain:\n              schema:\n                type: string\n              example: '1158201444'\n  messages:\n    post:\n      tags:\n      - Webhooks\n      summary: Message received from the user\n      description: Sent when a PHIZ user messages one of the application's Business Accounts or channels. `from`\n        is the user's Open ID in this application. Answer 2xx within 10 s and process asynchronously.\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: HMAC-SHA256 of `{timestamp}.{raw body}` using the app's webhook secret.\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: Unix epoch of the send. Reject if more than 5 min off.\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: Same across retries of the same event. Use it to drop duplicates.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            example:\n              object: phiz_business_account\n              entry:\n              - id: ba_7Kq2M9xTpL\n                changes:\n                - field: messages\n                  value:\n                    messaging_product: phiz\n                    metadata:\n                      sender_id: ba_7Kq2M9xTpL\n                      sender_type: business_account\n                      conversation_type: business_account\n                      display_name: Loja Exemplo\n                    contacts:\n                    - profile:\n                        name: Maria Souza\n                      open_id: oid_Qm7f2K9xT4Lw\n                      phone: '+5511987654321'\n                    messages:\n                    - from: oid_Qm7f2K9xT4Lw\n                      id: pmid.IN_01JA9W2C\n                      timestamp: '1760528527'\n                      type: text\n                      text:\n                        body: Quero reagendar a entrega\n                      context:\n                        id: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n  message_status:\n    post:\n      tags:\n      - Webhooks\n      summary: Status change of a sent message\n      description: 'One event per transition: `sent` → `delivered` → `read`, or `failed` with `errors`. Arrival\n        order is not guaranteed; use `timestamp`.'\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: HMAC-SHA256 of `{timestamp}.{raw body}` using the app's webhook secret.\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: Unix epoch of the send. Reject if more than 5 min off.\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: Same across retries of the same event. Use it to drop duplicates.\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            examples:\n              delivered:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9VZ6T8R3\n                          status: delivered\n                          timestamp: '1760528410'\n                          recipient_id: oid_Qm7f2K9xT4Lw\n                          biz_opaque_callback_data: pedido=48213\n                          conversation:\n                            id: conv_01JA9W\n                            origin:\n                              type: service\n                            expires_at: '1760614810'\n              failed:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9X0QW1\n                          status: failed\n                          timestamp: '1760528600'\n                          recipient_id: '+5511900000000'\n                          errors:\n                          - code: 2104\n                            title: recipient_not_reachable\n                            message: The phone number is not linked to a PHIZ account or blocked this sender.\n                            href: https://developers.phiz.chat/docs/errors#2104\n      responses:\n        '200':\n          description: OK\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n    oauth2:\n      type: oauth2\n      flows:\n        clientCredentials:\n          tokenUrl: https://gateway.phiz.chat/gateway/business/oauth/token\n          scopes:\n            messages:send: Send service messages and media\n            messages:read: Read message statuses\n            webhooks:manage: Manage app webhook (Phase 2)\n            account:read: Read application, Business Accounts and channels\n            templates:manage: Reserved for the Marketing API\n            recipients:resolve: Resolve recipient (proposal)\n            messages:send_marketing: Send marketing (reserved)\n  schemas:\n    TokenRequest:\n      type: object\n      required:\n      - grant_type\n      - client_id\n      - client_secret\n      properties:\n        grant_type:\n          type: string\n          enum:\n          - client_credentials\n        client_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: App ID (client_id) issued in the Developer Center.\n        client_secret:\n          type: string\n          format: password\n          example: phzsk_live_9c1f…\n          description: App secret. Shown only once, at creation or rotation.\n        scope:\n          type: string\n          example: messages:send messages:read\n          description: Requested scopes, space separated. If omitted, all scopes granted to the app are issued.\n    TokenResponse:\n      type: object\n      required:\n      - access_token\n      - token_type\n      - expires_in\n      - scope\n      properties:\n        access_token:\n          type: string\n          example: eyJhbGciOiJFUzI1NiIsImtpZCI6InBoei0yMDI2LTEwIn0…\n        token_type:\n          type: string\n          enum:\n          - Bearer\n        expires_in:\n          type: integer\n          example: 3600\n          description: Lifetime in seconds.\n        scope:\n          type: string\n          example: messages:send messages:read webhooks:manage\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n    TokenInfo:\n      type: object\n      properties:\n        active:\n          type: boolean\n          example: true\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        scope:\n          type: string\n          example: messages:send messages:read\n        senders:\n          type: array\n          items:\n            type: string\n          example:\n          - ba_7Kq2M9xTpL\n          - '1231'\n          description: Senders this app may use.\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-10-15T12:30:00Z'\n    App:\n      type: object\n      properties:\n        id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n          description: 'Develope
