r ID: the organization that owns the resources. It is the former Merchant ID under\n            a unified name, not a separate entity.'\n        name:\n          type: string\n          example: Blip · Atendimento\n        environment:\n          type: string\n          enum:\n          - test\n          - sandbox\n          - production\n        status:\n          type: string\n          enum:\n          - running\n          - in_review\n          - disabled\n    Sender:\n      type: object\n      properties:\n        id:\n          type: string\n          example: ba_7Kq2M9xTpL\n          description: sender_id used in the path. For a Business Account, mapped 1:1 to the BA ID.\n        type:\n          type: string\n          enum:\n          - business_account\n          - channel\n          example: business_account\n          description: '`business_account`: a Business Account created in the application (default). `channel`:\n            one of the merchant''s channels, optional.'\n        ba_id:\n          type: string\n          nullable: true\n          example: ba_7Kq2M9xTpL\n          description: Filled when type = business_account.\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: Application that owns the Business Account.\n        conversation_type:\n          type: string\n          enum:\n          - business_account\n          - channel_service\n          example: business_account\n          description: 'PhizChat conversation type: `business_account` (product shown to the user, under Business\n            service session › Public account session) or `channel_service`.'\n        display_name:\n          type: string\n          example: Loja Exemplo\n        channel_id:\n          type: string\n          nullable: true\n          example: null\n          description: Filled only when type = channel.\n        status:\n          type: string\n          enum:\n          - connected\n          - pending_review\n          - disabled\n        messaging_limit_tier:\n          type: string\n          example: TIER_1K\n          description: How many unique recipients may receive business-initiated messages in 24 h.\n        quality_rating:\n          type: string\n          enum:\n          - GREEN\n          - YELLOW\n          - RED\n          - UNKNOWN\n    ResolveRequest:\n      type: object\n      required:\n      - phone\n      properties:\n        phone:\n          type: string\n          example: '+5511987654321'\n          description: Phone number in E.164.\n    ResolveResponse:\n      type: object\n      properties:\n        addressable:\n          type: boolean\n          example: true\n          description: The Business Account can address this phone number.\n        eligible:\n          type: boolean\n          example: false\n          description: A business-initiated message would be accepted now.\n        reason:\n          type: string\n          enum:\n          - ok\n          - no_relation\n          - service_window_closed\n          - suppressed\n          - verification_required\n          - not_addressable\n          example: service_window_closed\n          description: Stable reason. Never reveals name, photo, friendship or whether the number is registered.\n    SenderList:\n      type: object\n      properties:\n        data:\n          type: array\n          items:\n            $ref: '#/components/schemas/Sender'\n        paging:\n          $ref: '#/components/schemas/Paging'\n    Paging:\n      type: object\n      properties:\n        next_cursor:\n          type: string\n          nullable: true\n          example: c2VuZGVyX2lkPXNuZF85\n    Recipient:\n      description: Recipient. Provide `to` and, if it is not a phone number, `to_type`. Phone numbers use E.164.\n      type: object\n    SendMessageRequest:\n      type: object\n      required:\n      - to\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n          default: phiz\n          description: Optional; kept for Cloud API compatibility.\n        recipient_type:\n          type: string\n          enum:\n          - individual\n          default: individual\n        to:\n          type: string\n          example: '+5511987654321'\n          description: Recipient phone number (E.164) or Open ID in this application. The phone number is converted\n            to the user's Open ID before sending.\n        to_type:\n          type: string\n          enum:\n          - phone\n          - open_id\n          default: phone\n        type:\n          type: string\n          enum:\n          - text\n          - image\n          - video\n          - audio\n          - document\n          - location\n          - interactive\n          - reaction\n          - template\n          description: '`template` is reserved for the future Marketing API.'\n        text:\n          $ref: '#/components/schemas/TextContent'\n        image:\n          $ref: '#/components/schemas/MediaContent'\n        video:\n          $ref: '#/components/schemas/MediaContent'\n        audio:\n          $ref: '#/components/schemas/MediaContent'\n        document:\n          $ref: '#/components/schemas/MediaContent'\n        location:\n          $ref: '#/components/schemas/LocationContent'\n        interactive:\n          $ref: '#/components/schemas/InteractiveContent'\n        reaction:\n          $ref: '#/components/schemas/ReactionContent'\n        context:\n          type: object\n          properties:\n            message_id:\n              type: string\n          description: Replies to (quotes) an earlier message.\n        biz_opaque_callback_data:\n          type: string\n          maxLength: 512\n          example: pedido=48213\n          description: Free text echoed back in every status webhook for this message.\n    TextContent:\n      type: object\n      required:\n      - body\n      properties:\n        body:\n          type: string\n          maxLength: 4096\n          example: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n        preview_url:\n          type: boolean\n          default: false\n    MediaContent:\n      type: object\n      description: Provide `id` (recommended) or `link`, both returned by the upload to `POST /v1/{sender_id}/media`.\n      anyOf:\n      - required:\n        - id\n      - required:\n        - link\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n          description: Media ID returned by the upload. Valid until `expires_at`.\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n          description: PHIZ link returned by the upload. Third-party URLs are rejected with error 2302.\n        caption:\n          type: string\n          maxLength: 1024\n          description: Not used for audio.\n        filename:\n          type: string\n          description: Document only.\n    MediaUploadRequest:\n      type: object\n      required:\n      - file\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        type:\n          type: string\n          example: application/pdf\n          description: MIME type of the file. Must be in the formats table in section 09.\n        file:\n          type: string\n          format: binary\n    Media:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n        mime_type:\n          type: string\n          example: application/pdf\n        file_size:\n          type: integer\n          example: 184320\n        sha256:\n          type: string\n          example: 9b1f…\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-11-19T14:00:00Z'\n          description: 'End of temporary storage (proposed: 30 days after upload). After it, `id` and `link` stop\n            working.'\n    LocationContent:\n      type: object\n      required:\n      - latitude\n      - longitude\n      properties:\n        latitude:\n          type: number\n          example: -23.5614\n        longitude:\n          type: number\n          example: -46.6559\n        name:\n          type: string\n          example: Loja Paulista\n        address:\n          type: string\n    InteractiveContent:\n      type: object\n      properties:\n        type:\n          type: string\n          enum:\n          - button\n          - list\n        body:\n          type: object\n          properties:\n            text:\n              type: string\n        action:\n          type: object\n          properties:\n            buttons:\n              type: array\n              maxItems: 3\n              items:\n                type: object\n                properties:\n                  type:\n                    type: string\n                    enum:\n                    - reply\n                  reply:\n                    type: object\n                    properties:\n                      id:\n                        type: string\n                      title:\n                        type: string\n                        maxLength: 20\n    ReactionContent:\n      type: object\n      properties:\n        message_id:\n          type: string\n        emoji:\n          type: string\n          example: 👍\n    SendMessageResponse:\n      type: object\n      properties:\n        messaging_product:\n          type: string\n          example: phiz\n        contacts:\n          type: array\n          items:\n            type: object\n            properties:\n              input:\n                type: string\n                example: '+5511987654321'\n              open_id:\n                type: string\n                nullable: true\n                example: null\n                description: The user's Open ID in this application. Filled only if the user is already bound to\n                  this Business Account.\n        messages:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: pmid.01JA9VZ6T8R3\n              message_status:\n                type: string\n                enum:\n                - accepted\n    MessageStatus:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmid.01JA9VZ6T8R3\n        sender_id:\n          type: string\n          example: ba_7Kq2M9xTpL\n        status:\n          type: string\n          enum:\n          - accepted\n          - sent\n          - delivered\n          - read\n          - failed\n        updated_at:\n          type: string\n          format: date-time\n        biz_opaque_callback_data:\n          type: string\n          nullable: true\n        errors:\n          type: array\n          items:\n            $ref: '#/components/schemas/ErrorDetail'\n    MarkReadRequest:\n      type: object\n      required:\n      - status\n      - message_id\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        status:\n          type: string\n          enum:\n          - read\n        message_id:\n          type: string\n          example: pmid.IN_01JA9W2C\n        typing_indicator:\n          type: boolean\n          default: false\n    WebhookConfig:\n      type: object\n      required:\n      - url\n      - verify_token\n      properties:\n        url:\n          type: string\n          format: uri\n          example: https://integracao.lojaexemplo.com.br/phiz/webhook\n        verify_token:\n          type: string\n          writeOnly: true\n          example: um-texto-que-so-voce-conhece\n          description: Text you choose, sent back in the GET handshake.\n        fields:\n          type: array\n          items:\n            type: string\n            enum:\n            - messages\n            - message_status\n            - sender_update\n            - account_update\n          example:\n          - messages\n          - message_status\n        status:\n          type: string\n          readOnly: true\n          enum:\n          - verified\n          - pending_verification\n          - failing\n          - disabled\n    WebhookEvent:\n      type: object\n      description: Envelope for every event. `entry[].id` is the BA ID. May batch several events of the same Business\n        Account.\n      properties:\n        object:\n          type: string\n          enum:\n          - phiz_business_account\n        entry:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: ba_7Kq2M9xTpL\n              changes:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    field:\n                      type: string\n                      enum:\n                      - messages\n                      - message_status\n                      - sender_update\n                      - account_update\n                    value:\n                      type: object\n    ErrorDetail:\n      type: object\n      properties:\n        code:\n          type: integer\n          example: 2104\n        title:\n          type: string\n          example: recipient_not_reachable\n        message:\n          type: string\n        href:\n          type: string\n          format: uri\n    OAuthError:\n      type: object\n      description: RFC 6749 §5.2\n      properties:\n        error:\n          type: string\n          enum:\n          - invalid_request\n          - invalid_client\n          - invalid_scope\n          - unsupported_grant_type\n        error_description:\n          type: string\n          example: Client authentication failed.\n    Error:\n      type: object\n      properties:\n        error:\n          type: object\n          properties:\n            code:\n              type: integer\n              example: 1003\n            type:\n              type: string\n              example: invalid_request\n            message:\n              type: string\n              example: Field 'to' must be E.164 when to_type is 'phone'.\n            details:\n              type: array\n              items:\n                type: object\n                properties:\n                  field:\n                    type: string\n                  issue:\n                    type: string\n            trace_id:\n              type: string\n              example: trc_9f2c41ab\n  responses:\n    BadRequest:\n      description: Invalid request.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    Unauthorized:\n      description: Missing, invalid or expired token.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            error:\n              code: 1101\n              type: unauthorized\n              message: Access token expired.\n              trace_id: trc_1a2b\n    Forbidden:\n      description: The app lacks the scope or access to the sender.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    NotFound:\n      description: Resource not found.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    TooManyRequests:\n      description: Rate limit reached. Honour Retry-After.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n      headers:\n        Retry-After:\n          schema:\n            type: integer\n    ServerError:\n      description: Internal error. Safe to retry with the same Idempotency-Key.\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n", "zh": "openapi: 3.1.0\ninfo:\n  title: PHIZ Business Messaging API\n  version: 1.0.0-draft\n  description: 'PHIZ 企业消息 API。第三方系统（CRM、Blip 和 Salesforce 等客服平台，或商户自有系统）可以通过 **手机号** 或 **Open ID** 向 PHIZ 用户发送消息，并通过\n    **Webhook** 接收用户回复和状态变更。\n\n\n    消息与 Webhook 的数据结构尽量对齐 Meta Cloud API（WhatsApp Business Platform），以降低现有集成的改造成本。\n\n\n    **状态：** 提案（RFC PHZ-0001），尚未实现。'\n  contact:\n    name: PHIZ Open Platform\n    url: https://open.phiz.chat\nservers:\n- url: https://{gateway}/gateway/business\n  description: 生产环境：现有 PHIZ 网关，前缀 /gateway/business\n  variables:\n    gateway:\n      default: gateway.phiz.chat\n      description: 生产网关主机（示例值）。\n- url: https://{gateway}/gateway/business\n  description: 沙箱环境：测试网关（Openapi-test），相同前缀\n  variables:\n    gateway:\n      default: gateway-test.phiz.chat\n      description: 测试网关主机（示例值）。\ntags:\n- name: Auth\n  description: OAuth 2.0 令牌签发与撤销（客户端凭证模式）。\n- name: Account\n  description: 应用、Business Account 与发送方。\n- name: Messages\n  description: 向手机号或 Open ID 发送消息并查询状态。\n- name: Media\n  description: 将媒体上传到 PHIZ 临时存储。消息中发送的所有媒体都必须经由此处上传；不接受第三方链接。\n- name: Webhooks\n  description: 推送到您服务器的事件。第 1 阶段由合作方在开发者中心的事件订阅中登记 Webhook URL；应用配置接口（`/v1/apps/{app_id}/webhook…`）属于第 2 阶段。\nsecurity:\n- bearerAuth: []\npaths:\n  /oauth/token:\n    post:\n      tags:\n      - Auth\n      summary: 获取访问令牌\n      description: 使用 client_id 和 client_secret 换取 Bearer 访问令牌（OAuth 2.0，RFC 6749 §4.4）。不提供刷新令牌：令牌过期后重新申请即可。支持 `application/x-www-form-urlencoded`（OAuth\n        标准）和 `application/json`。\n      operationId: getToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n          application/json:\n            schema:\n              $ref: '#/components/schemas/TokenRequest'\n            example:\n              grant_type: client_credentials\n              client_id: app_2Fk81PzQ\n              client_secret: phzsk_live_9c1f…\n              scope: messages:send messages:read\n      responses:\n        '200':\n          description: 令牌已签发。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenResponse'\n              example:\n                access_token: eyJhbGciOiJFUzI1NiIs…\n                token_type: Bearer\n                expires_in: 3600\n                scope: messages:send messages:read\n                developer_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        '400':\n          description: 请求无效（`invalid_request`、`invalid_scope`、`unsupported_grant_type`）。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n        '401':\n          description: 凭证无效（`invalid_client`）。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/OAuthError'\n              example:\n                error: invalid_client\n                error_description: Client authentication failed.\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n  /oauth/revoke:\n    post:\n      tags:\n      - Auth\n      summary: 撤销令牌\n      description: 在过期前撤销访问令牌（RFC 7009）。即使令牌已无效也返回 200。\n      operationId: revokeToken\n      security: []\n      requestBody:\n        required: true\n        content:\n          application/x-www-form-urlencoded:\n            schema:\n              type: object\n              required:\n              - token\n              - client_id\n              - client_secret\n              properties:\n                token:\n                  type: string\n                client_id:\n                  type: string\n                client_secret:\n                  type: string\n      responses:\n        '200':\n          description: OK\n  /v1/me:\n    get:\n      tags:\n      - Auth\n      summary: 查看当前令牌\n      description: 返回当前令牌对应的应用、Developer ID、范围和发送方（Business Account 与频道），便于排查集成问题（相当于 Meta 的 debug_token）。\n      operationId: getMe\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/TokenInfo'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n  /v1/apps/{app_id}:\n    get:\n      tags:\n      - Account\n      summary: 查询应用\n      description: 令牌所属应用的信息：Developer ID（原 Merchant ID）、环境和状态。\n      operationId: getApp\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/App'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/senders:\n    get:\n      tags:\n      - Account\n      summary: 列出发送方\n      description: 应用的发送方：在该应用下创建的 Business Account，以及已授权的频道（如有）。\n      operationId: listSenders\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      - name: cursor\n        in: query\n        schema:\n          type: string\n      - name: limit\n        in: query\n        schema:\n          type: integer\n          default: 25\n          maximum: 100\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SenderList'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/senders/{sender_id}:\n    get:\n      tags:\n      - Account\n      summary: 查询发送方\n      description: 发送方状态、发送额度与质量评级。\n      operationId: getSender\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud\n          API 的 phone_number_id。\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Sender'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/{sender_id}/messages:\n    post:\n      tags:\n      - Messages\n      summary: 发送消息\n      description: '以应用下某个 Business Account 的名义（`sender_id` 映射到 BA ID），或可选地通过频道，向手机号（E.164）或 Open ID 发送消息。手机号会换取用户的\n        Open ID；Business Account 绑定的是 Open ID，而不是手机号。`202` 仅表示消息已被受理；最终结果（`sent`、`delivered`、`read` 或 `failed`）通过\n        `message_status` Webhook 推送。\n\n\n        商户主动发送的消息需遵守选择接收（opt-in）策略，该策略由产品定义。\n\n\n        同一接口传入 `status: read` 可将收到的消息标记为已读（兼容 Cloud API）。'\n      operationId: sendMessage\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud\n          API 的 phone_number_id。\n      - name: Idempotency-Key\n        in: header\n        required: false\n        schema:\n          type: string\n          maxLength: 128\n        example: pedido-48213-confirmacao\n        description: 每个逻辑请求的唯一键。24 小时内重复使用同一键将返回原始响应，不会重复发送消息。\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              oneOf:\n              - $ref: '#/components/schemas/SendMessageRequest'\n              - $ref: '#/components/schemas/MarkReadRequest'\n            examples:\n              text_phone:\n                summary: 向手机号发送文本\n                value:\n                  messaging_product: phiz\n                  to: '+5511987654321'\n                  to_type: phone\n                  type: text\n                  text:\n                    body: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n                    preview_url: false\n                  biz_opaque_callback_data: pedido=48213\n              text_open_id:\n                summary: 向 Open ID 发送文本\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: text\n                  text:\n                    body: 'Seu cupom chegou: PHIZ10'\n              image:\n                summary: 通过媒体 id 发送图片\n                value:\n                  to: '+5511987654321'\n                  type: image\n                  image:\n                    id: pmed.01JB2K3H2D\n                    caption: Nota fiscal\n              audio:\n                summary: 通过媒体 id 发送音频\n                value:\n                  to: '+5511987654321'\n                  type: audio\n                  audio:\n                    id: pmed.01JB2K4M7A\n              video:\n                summary: 通过 PHIZ 链接发送视频\n                value:\n                  to: oid_Qm7f2K9xT4Lw\n                  to_type: open_id\n                  type: video\n                  video:\n                    link: https://media.phiz.chat/biz/pmed.01JB2K5V1C\n                    caption: Como montar seu produto\n              document:\n                summary: 文档\n                value:\n                  to: '+5511987654321'\n                  type: document\n                  document:\n                    id: pmed.01JB2K7Q9X\n                    filename: nota-fiscal-48213.pdf\n                    caption: 'Nota fiscal do pedido #48213'\n              buttons:\n                summary: 快捷回复按钮\n                value:\n                  to: '+5511987654321'\n                  type: interactive\n                  interactive:\n                    type: button\n                    body:\n                      text: Confirma a entrega amanhã entre 9h e 12h?\n                    action:\n                      buttons:\n                      - type: reply\n                        reply:\n                          id: confirmar\n                          title: Confirmar\n                      - type: reply\n                        reply:\n                          id: reagendar\n                          title: Reagendar\n              mark_read:\n                summary: 标记为已读\n                value:\n                  messaging_product: phiz\n                  status: read\n                  message_id: pmid.IN_01JA9W2C\n      responses:\n        '202':\n          description: 消息已受理。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/SendMessageResponse'\n              example:\n                messaging_product: phiz\n                contacts:\n                - input: '+5511987654321'\n                  open_id: null\n                messages:\n                - id: pmid.01JA9VZ6T8R3\n                  message_status: accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '409':\n          description: Idempotency-Key 被用于不同的请求体。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '422':\n          description: 选择接收策略不允许（2201）、类型不允许（2202）、不在服务窗口内（2203）、模板未批准（2204）、时段或区域受限（2205），或媒体已过期（2303）。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n              example:\n                error:\n                  code: 2201\n                  type: policy_violation\n                  message: Sending to this recipient is not allowed by the opt-in policy.\n                  trace_id: trc_77ac\n  /v1/{sender_id}/recipients/resolve:\n    post:\n      tags:\n      - Messages\n      summary: 解析接收方（提议）\n      description: '**来自 PHZ-BM-0001 的提议，待定（Q18）。**判断该 Business Account 当前能否向该手机号发送，且不暴露号码是否注册 PHIZ。需要 `recipients:resolve`\n        范围以及与用户的关系。'\n      operationId: resolveRecipient\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud\n          API 的 phone_number_id。\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/ResolveRequest'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/ResolveResponse'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/{sender_id}/media:\n    post:\n      tags:\n      - Media\n      summary: 上传媒体\n      description: '将文件上传到 PHIZ 临时存储，返回发送时使用的 `id` 和 `link`。格式和大小在此校验：不符合第 09 节表格时返回 415（2304）或 413（2305）。\n\n\n        文件在 `expires_at` 之前可用（建议 30 天），可被同一应用下的发送方多次使用。需要 `messages:send` 范围。'\n      operationId: uploadMedia\n      parameters:\n      - name: sender_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: ba_7Kq2M9xTpL\n        description: 发送方 ID：映射到应用下某个 Business Account 的 BA ID 的外部引用（默认），也可选用频道 ID。它不是 merchant_id。相当于 Meta Cloud\n          API 的 phone_number_id。\n      requestBody:\n        required: true\n        content:\n          multipart/form-data:\n            schema:\n              $ref: '#/components/schemas/MediaUploadRequest'\n      responses:\n        '200':\n          description: 媒体已存储。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '413':\n          description: 文件超过该类型的大小上限（2305）。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n        '415':\n          description: 格式不受支持（2304）。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /v1/media/{media_id}:\n    get:\n      tags:\n      - Media\n      summary: 查询媒体\n      description: 查询已上传媒体的链接、类型、大小和有效期。\n      operationId: getMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Media'\n              example:\n                id: pmed.01JB2K7Q9X\n                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n                mime_type: application/pdf\n                file_size: 184320\n                sha256: 9b1f…\n                expires_at: '2026-11-19T14:00:00Z'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n    delete:\n      tags:\n      - Media\n      summary: 删除媒体\n      description: 在到期前删除媒体。仍使用该 `id` 或 `link` 的发送将返回 2303。\n      operationId: deleteMedia\n      parameters:\n      - name: media_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmed.01JB2K7Q9X\n      responses:\n        '204':\n          description: 媒体已删除。\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/messages/{message_id}:\n    get:\n      tags:\n      - Messages\n      summary: 查询消息状态\n      description: 查询已发送消息的最新状态，作为兜底手段；Webhook 仍为主要来源。数据保留 30 天。\n      operationId: getMessage\n      parameters:\n      - name: message_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/MessageStatus'\n              example:\n                id: pmid.01JA9VZ6T8R3\n                sender_id: '1231'\n                status: delivered\n                updated_at: '2026-10-15T11:42:07Z'\n                biz_opaque_callback_data: pedido=48213\n                errors: []\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '404':\n          $ref: '#/components/responses/NotFound'\n  /v1/apps/{app_id}/webhook:\n    get:\n      tags:\n      - Webhooks\n      summary: 查询 Webhook\n      description: '**第 2 阶段。**应用 Webhook 订阅配置及健康状态。'\n      operationId: getWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n    put:\n      tags:\n      - Webhooks\n      summary: 配置 Webhook\n      description: '**第 2 阶段。**设置 URL、verify_token 和订阅事件。PHIZ 会先对 URL 发起 GET 握手，失败则返回 422。第 1 阶段由合作方在事件订阅中登记 URL。'\n      operationId: setWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookConfig'\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/WebhookConfig'\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n        '422':\n          description: 验证握手失败。\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n    delete:\n      tags:\n      - Webhooks\n      summary: 删除 Webhook\n      description: '**第 2 阶段。**停止向应用推送事件。'\n      operationId: deleteWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      responses:\n        '204':\n          description: No Content\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/test:\n    post:\n      tags:\n      - Webhooks\n      summary: 发送测试事件\n      description: '**第 2 阶段。**向已配置的 URL 推送一条已签名的 `messages` 示例事件。'\n      operationId: testWebhook\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      requestBody:\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                field:\n                  type: string\n                  enum:\n                  - messages\n                  - message_status\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries:\n    get:\n      tags:\n      - Webhooks\n      summary: 列出 Webhook 投递记录\n      description: '**第 2 阶段。**最近 72 小时的投递记录，含 HTTP 状态、重试次数与延迟，可重放失败的投递。'\n      operationId: listDeliveries\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      - name: status\n        in: query\n        schema:\n          type: string\n          enum:\n          - succeeded\n          - failed\n          - pending\n      responses:\n        '200':\n          description: OK\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\n  /v1/apps/{app_id}/webhook/deliveries/{delivery_id}/replay:\n    post:\n      tags:\n      - Webhooks\n      summary: 重放投递\n      description: '**第 2 阶段。**使用相同 `X-Phiz-Delivery-Id` 重新推送事件。'\n      operationId: replayDelivery\n      parameters:\n      - name: app_id\n        in: path\n        required: true\n        schema:\n          type: string\n        example: app_2Fk81PzQ\n        description: 开发者应用 ID。\n      - name: delivery_id\n        in: path\n        required: true\n        schema:\n          type: string\n      responses:\n        '202':\n          description: Accepted\n        '400':\n          $ref: '#/components/responses/BadRequest'\n        '401':\n          $ref: '#/components/responses/Unauthorized'\n        '403':\n          $ref: '#/components/responses/Forbidden'\n        '429':\n          $ref: '#/components/responses/TooManyRequests'\n        '500':\n          $ref: '#/components/responses/ServerError'\nwebhooks:\n  verification:\n    get:\n      tags:\n      - Webhooks\n      summary: 验证握手（对您服务器发起的 GET）\n      description: PHIZ 会携带 `hub.mode=subscribe`、`hub.verify_token` 和 `hub.challenge` 调用您的 URL。校验令牌后，以纯文本返回 200\n        和 `hub.challenge` 的值。\n      parameters:\n      - name: hub.mode\n        in: query\n        schema:\n          type: string\n          enum:\n          - subscribe\n      - name: hub.verify_token\n        in: query\n        schema:\n          type: string\n      - name: hub.challenge\n        in: query\n        schema:\n          type: string\n        example: '1158201444'\n      responses:\n        '200':\n          description: 响应体 = hub.challenge。\n          content:\n            text/plain:\n              schema:\n                type: string\n              example: '1158201444'\n  messages:\n    post:\n      tags:\n      - Webhooks\n      summary: 收到用户消息\n      description: 当 PHIZ 用户向应用的 Business Account 或频道发送消息时推送。`from` 为用户在本应用下的 Open ID。请在 10 秒内返回 2xx，并异步处理。\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: 使用应用 webhook secret 对 `{timestamp}.{原始请求体}` 计算的 HMAC-SHA256。\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: 发送时的 Unix 时间戳，偏差超过 5 分钟应拒绝。\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: 同一事件的所有重试均相同，可用于去重。\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            example:\n              object: phiz_business_account\n              entry:\n              - id: ba_7Kq2M9xTpL\n                changes:\n                - field: messages\n                  value:\n                    messaging_product: phiz\n                    metadata:\n                      sender_id: ba_7Kq2M9xTpL\n                      sender_type: business_account\n                      conversation_type: business_account\n                      display_name: Loja Exemplo\n                    contacts:\n                    - profile:\n                        name: Maria Souza\n                      open_id: oid_Qm7f2K9xT4Lw\n                      phone: '+5511987654321'\n                    messages:\n                    - from: oid_Qm7f2K9xT4Lw\n                      id: pmid.IN_01JA9W2C\n                      timestamp: '1760528527'\n                      type: text\n                      text:\n                        body: Quero reagendar a entrega\n                      context:\n                        id: pmid.01JA9VZ6T8R3\n      responses:\n        '200':\n          description: OK\n  message_status:\n    post:\n      tags:\n      - Webhooks\n      summary: 已发送消息的状态变更\n      description: 每次状态变化推送一次：`sent` → `delivered` → `read`，或带 `errors` 的 `failed`。不保证到达顺序，请以 `timestamp` 为准。\n      parameters:\n      - name: X-Phiz-Signature-256\n        in: header\n        required: true\n        schema:\n          type: string\n        example: sha256=6f1c…\n        description: 使用应用 webhook secret 对 `{timestamp}.{原始请求体}` 计算的 HMAC-SHA256。\n      - name: X-Phiz-Timestamp\n        in: header\n        required: true\n        schema:\n          type: integer\n        example: 1760528527\n        description: 发送时的 Unix 时间戳，偏差超过 5 分钟应拒绝。\n      - name: X-Phiz-Delivery-Id\n        in: header\n        required: true\n        schema:\n          type: string\n        example: dlv_01JA9W2D7K\n        description: 同一事件的所有重试均相同，可用于去重。\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: '#/components/schemas/WebhookEvent'\n            examples:\n              delivered:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9VZ6T8R3\n                          status: delivered\n                          timestamp: '1760528410'\n                          recipient_id: oid_Qm7f2K9xT4Lw\n                          biz_opaque_callback_data: pedido=48213\n                          conversation:\n                            id: conv_01JA9W\n                            origin:\n                              type: service\n                            expires_at: '1760614810'\n              failed:\n                value:\n                  object: phiz_business_account\n                  entry:\n                  - id: ba_7Kq2M9xTpL\n                    changes:\n                    - field: message_status\n                      value:\n                        messaging_product: phiz\n                        metadata:\n                          sender_id: ba_7Kq2M9xTpL\n                          sender_type: business_account\n                          conversation_type: business_account\n                          display_name: Loja Exemplo\n                        statuses:\n                        - id: pmid.01JA9X0QW1\n                          status: failed\n                          timestamp: '1760528600'\n                          recipient_id: '+5511900000000'\n                          errors:\n                          - code: 2104\n                            title: recipient_not_reachable\n                            message: The phone number is not linked to a PHIZ account or blocked this sender.\n                            href: https://developers.phiz.chat/docs/errors#2104\n      responses:\n        '200':\n          description: OK\ncomponents:\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n    oauth2:\n      type: oauth2\n      flows:\n        clientCredentials:\n          tokenUrl: https://gateway.phiz.chat/gateway/business/oauth/token\n          scopes:\n            messages:send: 发送服务消息和媒体\n            messages:read: 读取消息状态\n            webhooks:manage: 管理应用 Webhook（第 2 阶段）\n            account:read: 读取应用、Business Account 与频道\n            templates:manage: 预留给 Marketing API\n            recipients:resolve: 解析接收方（提议）\n            messages:send_marketing: 发送营销消息（预留）\n  schemas:\n    TokenRequest:\n      type: object\n      required:\n      - grant_type\n      - client_id\n      - client_secret\n      properties:\n        grant_type:\n          type: string\n          enum:\n          - client_credentials\n        client_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: 在开发者中心生成的应用 ID（client_id）。\n        client_secret:\n          type: string\n          format: password\n          example: phzsk_live_9c1f…\n          description: 应用密钥，仅在创建或轮换时显示一次。\n        scope:\n          type: string\n          example: messages:send messages:read\n          description: 以空格分隔的请求范围。省略时签发应用已获授权的全部范围。\n    TokenResponse:\n      type: object\n      required:\n      - access_token\n      - token_type\n      - expires_in\n      - scope\n      properties:\n        access_token:\n          type: string\n          example: eyJhbGciOiJFUzI1NiIsImtpZCI6InBoei0yMDI2LTEwIn0…\n        token_type:\n          type: string\n          enum:\n          - Bearer\n        expires_in:\n          type: integer\n          example: 3600\n          description: 有效期（秒）。\n        scope:\n          type: string\n          example: messages:send messages:read webhooks:manage\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n    TokenInfo:\n      type: object\n      properties:\n        active:\n          type: boolean\n          example: true\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n        scope:\n          type: string\n          example: messages:send messages:read\n        senders:\n          type: array\n          items:\n            type: string\n          example:\n          - ba_7Kq2M9xTpL\n          - '1231'\n          description: 此应用可使用的发送方。\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-10-15T12:30:00Z'\n    App:\n      type: object\n      properties:\n        id:\n          type: string\n          example: app_2Fk81PzQ\n        developer_id:\n          type: string\n          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57\n          description: Developer ID：拥有资源的组织，即原 Merchant ID 的统一称呼，而非独立主体。\n        name:\n          type: string\n          example: Blip · Atendimento\n        environment:\n          type: string\n          enum:\n          - test\n          - sandbox\n          - production\n        status:\n          type: string\n          enum:\n          - running\n          - in_review\n          - disabled\n    Sender:\n      type: object\n      properties:\n        id:\n          type: string\n          example: ba_7Kq2M9xTpL\n          description: 路径中使用的 sender_id。Business Account 与 BA ID 一一对应。\n        type:\n          type: string\n          enum:\n          - business_account\n          - channel\n          example: business_account\n          description: '`business_account`：在应用下创建的 Business Account（默认）。`channel`：商户的频道，可选。'\n        ba_id:\n          type: string\n          nullable: true\n          example: ba_7Kq2M9xTpL\n          description: type = business_account 时有值。\n        app_id:\n          type: string\n          example: app_2Fk81PzQ\n          description: Business Account 所属的应用。\n        conversation_type:\n          type: string\n          enum:\n          - business_account\n          - channel_service\n          example: business_account\n          description: PhizChat 会话类型：`business_account`（对外展示的产品类型，属于 公众号会话 › 企业服务会话）或 `channel_service`。\n        display_name:\n          type: string\n          example: Loja Exemplo\n        channel_id:\n          type: string\n          nullable: true\n          example: null\n          description: 仅当 type = channel 时有值。\n        status:\n          type: string\n          enum:\n          - connected\n          - pending_review\n          - disabled\n        messaging_limit_tier:\n          type: string\n          example: TIER_1K\n          description: 24 小时内可接收企业主动消息的唯一用户数上限。\n        quality_rating:\n          type: string\n          enum:\n          - GREEN\n          - YELLOW\n          - RED\n          - UNKNOWN\n    ResolveRequest:\n      type: object\n      required:\n      - phone\n      properties:\n        phone:\n          type: string\n          example: '+5511987654321'\n          description: E.164 格式手机号。\n    ResolveResponse:\n      type: object\n      properties:\n        addressable:\n          type: boolean\n          example: true\n          description: 该 Business Account 可以向此手机号发送。\n        eligible:\n          type: boolean\n          example: false\n          description: 当前企业主动发送的消息会被受理。\n        reason:\n          type: string\n          enum:\n          - ok\n          - no_relation\n          - service_window_closed\n          - suppressed\n          - verification_required\n          - not_addressable\n          example: service_window_closed\n          description: 稳定的原因码，绝不暴露姓名、头像、好友关系或号码是否注册。\n    SenderList:\n      type: object\n      properties:\n        data:\n          type: array\n          items:\n            $ref: '#/components/schemas/Sender'\n        paging:\n          $ref: '#/components/schemas/Paging'\n    Paging:\n      type: object\n      properties:\n        next_cursor:\n          type: string\n          nullable: true\n          example: c2VuZGVyX2lkPXNuZF85\n    Recipient:\n      description: 接收方。填写 `to`；若不是手机号，需指定 `to_type`。手机号采用 E.164 格式。\n      type: object\n    SendMessageRequest:\n      type: object\n      required:\n      - to\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n          default: phiz\n          description: 可选；为兼容 Cloud API 而保留。\n        recipient_type:\n          type: string\n          enum:\n          - individual\n          default: individual\n        to:\n          type: string\n          example: '+5511987654321'\n          description: 接收方手机号（E.164）或其在本应用下的 Open ID。手机号会在发送前换取用户的 Open ID。\n        to_type:\n          type: string\n          enum:\n          - phone\n          - open_id\n          default: phone\n        type:\n          type: string\n          enum:\n          - text\n          - image\n          - video\n          - audio\n          - document\n          - location\n          - interactive\n          - reaction\n          - template\n          description: '`template` 预留给后续的 Marketing API。'\n        text:\n          $ref: '#/components/schemas/TextContent'\n        image:\n          $ref: '#/components/schemas/MediaContent'\n        video:\n          $ref: '#/components/schemas/MediaContent'\n        audio:\n          $ref: '#/components/schemas/MediaContent'\n        document:\n          $ref: '#/components/schemas/MediaContent'\n        location:\n          $ref: '#/components/schemas/LocationContent'\n        interactive:\n          $ref: '#/components/schemas/InteractiveContent'\n        reaction:\n          $ref: '#/components/schemas/ReactionContent'\n        context:\n          type: object\n          properties:\n            message_id:\n              type: string\n          description: 引用回复之前的消息。\n        biz_opaque_callback_data:\n          type: string\n          maxLength: 512\n          example: pedido=48213\n          description: 自定义文本，会在此消息的所有状态 Webhook 中原样返回。\n    TextContent:\n      type: object\n      required:\n      - body\n      properties:\n        body:\n          type: string\n          maxLength: 4096\n          example: 'Olá, Maria! Seu pedido #48213 foi enviado.'\n        preview_url:\n          type: boolean\n          default: false\n    MediaContent:\n      type: object\n      description: 提供 `id`（推荐）或 `link`，二者均由 `POST /v1/{sender_id}/media` 上传后返回。\n      anyOf:\n      - required:\n        - id\n      - required:\n        - link\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n          description: 上传后返回的媒体 ID，在 `expires_at` 之前有效。\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n          description: 上传后返回的 PHIZ 链接。第三方 URL 会被拒绝并返回错误 2302。\n        caption:\n          type: string\n          maxLength: 1024\n          description: 音频不适用。\n        filename:\n          type: string\n          description: 仅适用于 document。\n    MediaUploadRequest:\n      type: object\n      required:\n      - file\n      - type\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        type:\n          type: string\n          example: application/pdf\n          description: 文件的 MIME 类型，须在第 09 节的格式表中。\n        file:\n          type: string\n          format: binary\n    Media:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmed.01JB2K7Q9X\n        link:\n          type: string\n          format: uri\n          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X\n        mime_type:\n          type: string\n          example: application/pdf\n        file_size:\n          type: integer\n          example: 184320\n        sha256:\n          type: string\n          example: 9b1f…\n        expires_at:\n          type: string\n          format: date-time\n          example: '2026-11-19T14:00:00Z'\n          description: 临时存储截止时间（建议：上传后 30 天）。到期后 `id` 和 `link` 失效。\n    LocationContent:\n      type: object\n      required:\n      - latitude\n      - longitude\n      properties:\n        latitude:\n          type: number\n          example: -23.5614\n        longitude:\n          type: number\n          example: -46.6559\n        name:\n          type: string\n          example: Loja Paulista\n        address:\n          type: string\n    InteractiveContent:\n      type: object\n      properties:\n        type:\n          type: string\n          enum:\n          - button\n          - list\n        body:\n          type: object\n          properties:\n            text:\n              type: string\n        action:\n          type: object\n          properties:\n            buttons:\n              type: array\n              maxItems: 3\n              items:\n                type: object\n                properties:\n                  type:\n                    type: string\n                    enum:\n                    - reply\n                  reply:\n                    type: object\n                    properties:\n                      id:\n                        type: string\n                      title:\n                        type: string\n                        maxLength: 20\n    ReactionContent:\n      type: object\n      properties:\n        message_id:\n          type: string\n        emoji:\n          type: string\n          example: 👍\n    SendMessageResponse:\n      type: object\n      properties:\n        messaging_product:\n          type: string\n          example: phiz\n        contacts:\n          type: array\n          items:\n            type: object\n            properties:\n              input:\n                type: string\n                example: '+5511987654321'\n              open_id:\n                type: string\n                nullable: true\n                example: null\n                description: 用户在本应用下的 Open ID。仅当用户已与该 Business Account 建立绑定关系时返回。\n        messages:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: pmid.01JA9VZ6T8R3\n              message_status:\n                type: string\n                enum:\n                - accepted\n    MessageStatus:\n      type: object\n      properties:\n        id:\n          type: string\n          example: pmid.01JA9VZ6T8R3\n        sender_id:\n          type: string\n          example: ba_7Kq2M9xTpL\n        status:\n          type: string\n          enum:\n          - accepted\n          - sent\n          - delivered\n          - read\n          - failed\n        updated_at:\n          type: string\n          format: date-time\n        biz_opaque_callback_data:\n          type: string\n          nullable: true\n        errors:\n          type: array\n          items:\n            $ref: '#/components/schemas/ErrorDetail'\n    MarkReadRequest:\n      type: object\n      required:\n      - status\n      - message_id\n      properties:\n        messaging_product:\n          type: string\n          enum:\n          - phiz\n        status:\n          type: string\n          enum:\n          - read\n        message_id:\n          type: string\n          example: pmid.IN_01JA9W2C\n        typing_indicator:\n          type: boolean\n          default: false\n    WebhookConfig:\n      type: object\n      required:\n      - url\n      - verify_token\n      properties:\n        url:\n          type: string\n          format: uri\n          example: https://integracao.lojaexemplo.com.br/phiz/webhook\n        verify_token:\n          type: string\n          writeOnly: true\n          example: um-texto-que-so-voce-conhece\n          description: 由您设定，会在 GET 握手时回传。\n        fields:\n          type: array\n          items:\n            type: string\n            enum:\n            - messages\n            - message_status\n            - sender_update\n            - account_update\n          example:\n          - messages\n          - message_status\n        status:\n          type: string\n          readOnly: true\n          enum:\n          - verified\n          - pending_verification\n          - failing\n          - disabled\n    WebhookEvent:\n      type: object\n      description: 所有事件的外层结构，`entry[].id` 为 BA ID，可批量包含同一 Business Account 的多个事件。\n      properties:\n        object:\n          type: string\n          enum:\n          - phiz_business_account\n        entry:\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                example: ba_7Kq2M9xTpL\n              changes:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    field:\n                      type: string\n                      enum:\n                      - messages\n                      - message_status\n                      - sender_update\n                      - account_update\n                    value:\n                      type: object\n    ErrorDetail:\n      type: object\n      properties:\n        code:\n          type: integer\n          example: 2104\n        title:\n          type: string\n          example: recipient_not_reachable\n        message:\n          type: string\n        href:\n          type: string\n          format: uri\n    OAuthError:\n      type: object\n      description: RFC 6749 §5.2\n      properties:\n        error:\n          type: string\n          enum:\n          - invalid_request\n          - invalid_client\n          - invalid_scope\n          - unsupported_grant_type\n        error_description:\n          type: string\n          example: Client authentication failed.\n    Error:\n      type: object\n      properties:\n        error:\n          type: object\n          properties:\n            code:\n              type: integer\n              example: 1003\n            type:\n              type: string\n              example: invalid_request\n            message:\n              type: string\n              example: Field 'to' must be E.164 when to_type is 'phone'.\n            details:\n              type: array\n              items:\n                type: object\n                properties:\n                  field:\n                    type: string\n                  issue:\n                    type: string\n            trace_id:\n              type: string\n              example: trc_9f2c41ab\n  responses:\n    BadRequest:\n      description: 请求无效。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    Unauthorized:\n      description: 令牌缺失、无效或已过期。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n          example:\n            error:\n              code: 1101\n              type: unauthorized\n              message: Access token expired.\n              trace_id: trc_1a2b\n    Forbidden:\n      description: 应用缺少所需范围或无权使用该发送方。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    NotFound:\n      description: 资源不存在。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    TooManyRequests:\n      description: 超出速率限制，请遵循 Retry-After。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n      headers:\n        Retry-After:\n          schema:\n            type: integer\n    ServerError:\n      description: 服务器内部错误，可使用相同的 Idempotency-Key 重试。\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n"};</script>
