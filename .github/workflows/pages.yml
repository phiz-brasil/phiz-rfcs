name: Redirect the old address
# The site moved to Vercel (apps/web). GitHub Pages now only publishes pages-redirect/: every address of the old site
# (https://phiz-brasil.github.io/phiz-rfcs/…) goes to the same path on https://phiz-rfcs.vercel.app.
on:
  push:
    branches: [main]
    paths: [pages-redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages-redirect }
      - id: deployment
        uses: actions/deploy-pages@v4
