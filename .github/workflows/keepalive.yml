name: Keep Supabase awake
# Free Supabase projects are paused after about a week without activity, which would take comments and status offline.
# A small read twice a week counts as activity. It uses the same public key the site already ships in site.config.json.
on:
  schedule:
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from the database
        run: |
          url=$(jq -r .comments.supabaseUrl site.config.json)
          key=$(jq -r .comments.supabaseKey site.config.json)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/rfc_comments?select=id&limit=1" -H "apikey: $key")
          echo "Supabase answered HTTP $code"
          test "$code" = 200
