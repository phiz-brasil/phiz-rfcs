name: Check RFCs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # the three rules of docs/spec/v2/guardrail.md (spec, tests, no regression); the text of the PR is read for `Guardrail-Skip:` lines
  guardrail:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/guardrail.py --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck -w apps/web
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      # against the Next.js app: tools/run_tests.py builds it once, runs one `next start` and spreads the test files over the CPUs of the runner
      # (docs/spec/v2/guardrail.md, "A faster suite"); `python -m unittest discover -s tests` runs the same tests one by one
      - run: python tools/run_tests.py
