openapi: 3.1.0
info:
  title: PHIZ Business Messaging API
  version: 1.0.0-draft
  description: 'PHIZ 企业消息 API。第三方系统（CRM、Blip 和 Salesforce 等客服平台，或商户自有系统）可以通过 **手机号** 或 **PHIZ ID** 向 PHIZ 用户发送消息，并通过
    **Webhook** 接收用户回复和状态变更。


    消息与 Webhook 的数据结构尽量对齐 Meta Cloud API（WhatsApp Business Platform），以降低现有集成的改造成本。


    **状态：** 提案（RFC PHZ-0001），尚未实现。'
  contact:
    name: PHIZ Open Platform
    url: https://open.phiz.chat
servers:
- url: https://{gateway}/gateway/business
  description: 生产环境：现有 PHIZ 网关，前缀 /gateway/business
  variables:
    gateway:
      default: gateway.phiz.chat
      description: 生产网关主机（示例值）。
- url: https://{gateway}/gateway/business
  description: 沙箱环境：测试网关（Openapi-test），相同前缀
  variables:
    gateway:
      default: gateway-test.phiz.chat
      description: 测试网关主机（示例值）。
tags:
- name: Auth
  description: OAuth 2.0 令牌签发与撤销（客户端凭证模式）。
- name: Account
  description: 商户账号、发送方与开发者应用。
- name: Messages
  description: 向手机号或 PHIZ ID 发送消息并查询状态。
- name: Media
  description: 将媒体上传到 PHIZ 临时存储。消息中发送的所有媒体都必须经由此处上传；不接受第三方链接。
- name: Webhooks
  description: 应用的 Webhook 订阅配置以及推送到您服务器的事件。
security:
- bearerAuth: []
paths:
  /oauth/token:
    post:
      tags:
      - Auth
      summary: 获取访问令牌
      description: 使用 client_id 和 client_secret 换取 Bearer 访问令牌（OAuth 2.0，RFC 6749 §4.4）。不提供刷新令牌：令牌过期后重新申请即可。支持 `application/x-www-form-urlencoded`（OAuth
        标准）和 `application/json`。
      operationId: getToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              grant_type: client_credentials
              client_id: app_2Fk81PzQ
              client_secret: phzsk_live_9c1f…
              scope: messages:send messages:read
      responses:
        '200':
          description: 令牌已签发。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJFUzI1NiIs…
                token_type: Bearer
                expires_in: 3600
                scope: messages:send messages:read
                merchant_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        '400':
          description: 请求无效（`invalid_request`、`invalid_scope`、`unsupported_grant_type`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: 凭证无效（`invalid_client`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
              example:
                error: invalid_client
                error_description: Client authentication failed.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /oauth/revoke:
    post:
      tags:
      - Auth
      summary: 撤销令牌
      description: 在过期前撤销访问令牌（RFC 7009）。即使令牌已无效也返回 200。
      operationId: revokeToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              - client_id
              - client_secret
              properties:
                token:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        '200':
          description: OK
  /v1/me:
    get:
      tags:
      - Auth
      summary: 查看当前令牌
      description: 返回当前令牌对应的应用、商户、范围和可用发送方，便于排查集成问题（相当于 Meta 的 debug_token）。
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/merchants/{merchant_id}:
    get:
      tags:
      - Account
      summary: 查询商户账号
      description: 应用所属商户账号的信息。
      operationId: getMerchant
      parameters:
      - name: merchant_id
        in: path
        required: true
        schema:
          type: string
        example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        description: 商户账号 ID。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/merchants/{merchant_id}/senders:
    get:
      tags:
      - Account
      summary: 列出发送方
      description: 集成可使用的发送方：商户本身（始终存在），以及已授权的频道（如有）。
      operationId: listSenders
      parameters:
      - name: merchant_id
        in: path
        required: true
        schema:
          type: string
        example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        description: 商户账号 ID。
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/senders/{sender_id}:
    get:
      tags:
      - Account
      summary: 查询发送方
      description: 发送方状态、发送额度与质量评级。
      operationId: getSender
      parameters:
      - name: sender_id
        in: path
        required: true
        schema:
          type: string
        example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        description: 发送方 ID。使用 merchant_id 直接以商户名义发送（默认，无需频道），或可选地使用商户某个频道的 ID。相当于 Meta Cloud API 的 phone_number_id。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/{sender_id}/messages:
    post:
      tags:
      - Messages
      summary: 发送消息
      description: '以商户名义（`sender_id` = `merchant_id`）或可选地通过商户的某个频道，向手机号（E.164）或 PHIZ ID 发送消息。`202` 仅表示消息已被受理；最终结果（`sent`、`delivered`、`read`
        或 `failed`）通过 `message_status` Webhook 推送。


        商户主动发送的消息需遵守选择接收（opt-in）策略，该策略由产品定义。


        同一接口传入 `status: read` 可将收到的消息标记为已读（兼容 Cloud API）。'
      operationId: sendMessage
      parameters:
      - name: sender_id
        in: path
        required: true
        schema:
          type: string
        example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        description: 发送方 ID。使用 merchant_id 直接以商户名义发送（默认，无需频道），或可选地使用商户某个频道的 ID。相当于 Meta Cloud API 的 phone_number_id。
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: pedido-48213-confirmacao
        description: 每个逻辑请求的唯一键。24 小时内重复使用同一键将返回原始响应，不会重复发送消息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SendMessageRequest'
              - $ref: '#/components/schemas/MarkReadRequest'
            examples:
              text_phone:
                summary: 向手机号发送文本
                value:
                  messaging_product: phiz
                  to: '+5511987654321'
                  to_type: phone
                  type: text
                  text:
                    body: 'Olá, Maria! Seu pedido #48213 foi enviado.'
                    preview_url: false
                  biz_opaque_callback_data: pedido=48213
              text_phiz_id:
                summary: 向 PHIZ ID 发送文本
                value:
                  to: '839201447'
                  to_type: phiz_id
                  type: text
                  text:
                    body: 'Seu cupom chegou: PHIZ10'
              image:
                summary: 通过媒体 id 发送图片
                value:
                  to: '+5511987654321'
                  type: image
                  image:
                    id: pmed.01JB2K3H2D
                    caption: Nota fiscal
              audio:
                summary: 通过媒体 id 发送音频
                value:
                  to: '+5511987654321'
                  type: audio
                  audio:
                    id: pmed.01JB2K4M7A
              video:
                summary: 通过 PHIZ 链接发送视频
                value:
                  to: '839201447'
                  to_type: phiz_id
                  type: video
                  video:
                    link: https://media.phiz.chat/biz/pmed.01JB2K5V1C
                    caption: Como montar seu produto
              document:
                summary: 文档
                value:
                  to: '+5511987654321'
                  type: document
                  document:
                    id: pmed.01JB2K7Q9X
                    filename: nota-fiscal-48213.pdf
                    caption: 'Nota fiscal do pedido #48213'
              buttons:
                summary: 快捷回复按钮
                value:
                  to: '+5511987654321'
                  type: interactive
                  interactive:
                    type: button
                    body:
                      text: Confirma a entrega amanhã entre 9h e 12h?
                    action:
                      buttons:
                      - type: reply
                        reply:
                          id: confirmar
                          title: Confirmar
                      - type: reply
                        reply:
                          id: reagendar
                          title: Reagendar
              mark_read:
                summary: 标记为已读
                value:
                  messaging_product: phiz
                  status: read
                  message_id: pmid.IN_01JA9W2C
      responses:
        '202':
          description: 消息已受理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
              example:
                messaging_product: phiz
                contacts:
                - input: '+5511987654321'
                  phiz_id: null
                messages:
                - id: pmid.01JA9VZ6T8R3
                  message_status: accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '409':
          description: Idempotency-Key 被用于不同的请求体。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 选择接收策略不允许此次发送、该发送方不允许此类型，或媒体已过期（2303）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: 2201
                  type: policy_violation
                  message: Sending to this recipient is not allowed by the opt-in policy.
                  trace_id: trc_77ac
  /v1/{sender_id}/media:
    post:
      tags:
      - Media
      summary: 上传媒体
      description: '将文件上传到 PHIZ 临时存储，返回发送时使用的 `id` 和 `link`。格式和大小在此校验：不符合第 09 节表格时返回 415（2304）或 413（2305）。


        文件在 `expires_at` 之前可用（建议 30 天），可被同一商户账号下的发送方多次使用。需要 `messages:send` 范围。'
      operationId: uploadMedia
      parameters:
      - name: sender_id
        in: path
        required: true
        schema:
          type: string
        example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        description: 发送方 ID。使用 merchant_id 直接以商户名义发送（默认，无需频道），或可选地使用商户某个频道的 ID。相当于 Meta Cloud API 的 phone_number_id。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
      responses:
        '200':
          description: 媒体已存储。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              example:
                id: pmed.01JB2K7Q9X
                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X
                mime_type: application/pdf
                file_size: 184320
                sha256: 9b1f…
                expires_at: '2026-11-19T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '413':
          description: 文件超过该类型的大小上限（2305）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 格式不受支持（2304）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/media/{media_id}:
    get:
      tags:
      - Media
      summary: 查询媒体
      description: 查询已上传媒体的链接、类型、大小和有效期。
      operationId: getMedia
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
        example: pmed.01JB2K7Q9X
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
              example:
                id: pmed.01JB2K7Q9X
                link: https://media.phiz.chat/biz/pmed.01JB2K7Q9X
                mime_type: application/pdf
                file_size: 184320
                sha256: 9b1f…
                expires_at: '2026-11-19T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Media
      summary: 删除媒体
      description: 在到期前删除媒体。仍使用该 `id` 或 `link` 的发送将返回 2303。
      operationId: deleteMedia
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
        example: pmed.01JB2K7Q9X
      responses:
        '204':
          description: 媒体已删除。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/messages/{message_id}:
    get:
      tags:
      - Messages
      summary: 查询消息状态
      description: 查询已发送消息的最新状态，作为兜底手段；Webhook 仍为主要来源。数据保留 30 天。
      operationId: getMessage
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
        example: pmid.01JA9VZ6T8R3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatus'
              example:
                id: pmid.01JA9VZ6T8R3
                sender_id: '1231'
                status: delivered
                updated_at: '2026-10-15T11:42:07Z'
                biz_opaque_callback_data: pedido=48213
                errors: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/apps/{app_id}/webhook:
    get:
      tags:
      - Webhooks
      summary: 查询 Webhook
      description: 应用 Webhook 订阅配置及健康状态。
      operationId: getWebhook
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - Webhooks
      summary: 配置 Webhook
      description: 设置 URL、verify_token 和订阅事件。PHIZ 会先对 URL 发起 GET 握手，失败则返回 422。
      operationId: setWebhook
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '422':
          description: 验证握手失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Webhooks
      summary: 删除 Webhook
      description: 停止向应用推送事件。
      operationId: deleteWebhook
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/apps/{app_id}/webhook/test:
    post:
      tags:
      - Webhooks
      summary: 发送测试事件
      description: 向已配置的 URL 推送一条已签名的 `messages` 示例事件。
      operationId: testWebhook
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                field:
                  type: string
                  enum:
                  - messages
                  - message_status
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/apps/{app_id}/webhook/deliveries:
    get:
      tags:
      - Webhooks
      summary: 列出 Webhook 投递记录
      description: 最近 72 小时的投递记录，含 HTTP 状态、重试次数与延迟，可重放失败的投递。
      operationId: listDeliveries
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      - name: status
        in: query
        schema:
          type: string
          enum:
          - succeeded
          - failed
          - pending
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/apps/{app_id}/webhook/deliveries/{delivery_id}/replay:
    post:
      tags:
      - Webhooks
      summary: 重放投递
      description: 使用相同 `X-Phiz-Delivery-Id` 重新推送事件。
      operationId: replayDelivery
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
        example: app_2Fk81PzQ
        description: 开发者应用 ID。
      - name: delivery_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
webhooks:
  verification:
    get:
      tags:
      - Webhooks
      summary: 验证握手（对您服务器发起的 GET）
      description: PHIZ 会携带 `hub.mode=subscribe`、`hub.verify_token` 和 `hub.challenge` 调用您的 URL。校验令牌后，以纯文本返回 200
        和 `hub.challenge` 的值。
      parameters:
      - name: hub.mode
        in: query
        schema:
          type: string
          enum:
          - subscribe
      - name: hub.verify_token
        in: query
        schema:
          type: string
      - name: hub.challenge
        in: query
        schema:
          type: string
        example: '1158201444'
      responses:
        '200':
          description: 响应体 = hub.challenge。
          content:
            text/plain:
              schema:
                type: string
              example: '1158201444'
  messages:
    post:
      tags:
      - Webhooks
      summary: 收到用户消息
      description: 当 PHIZ 用户向商户的发送方发送消息时推送。请在 10 秒内返回 2xx，并异步处理。
      parameters:
      - name: X-Phiz-Signature-256
        in: header
        required: true
        schema:
          type: string
        example: sha256=6f1c…
        description: 使用应用 webhook secret 对 `{timestamp}.{原始请求体}` 计算的 HMAC-SHA256。
      - name: X-Phiz-Timestamp
        in: header
        required: true
        schema:
          type: integer
        example: 1760528527
        description: 发送时的 Unix 时间戳，偏差超过 5 分钟应拒绝。
      - name: X-Phiz-Delivery-Id
        in: header
        required: true
        schema:
          type: string
        example: dlv_01JA9W2D7K
        description: 同一事件的所有重试均相同，可用于去重。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            example:
              object: phiz_merchant_account
              entry:
              - id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                changes:
                - field: messages
                  value:
                    messaging_product: phiz
                    metadata:
                      sender_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                      sender_type: merchant
                      conversation_type: business_account
                      display_name: Loja Exemplo
                    contacts:
                    - profile:
                        name: Maria Souza
                      phiz_id: '839201447'
                      phone: '+5511987654321'
                    messages:
                    - from: '839201447'
                      id: pmid.IN_01JA9W2C
                      timestamp: '1760528527'
                      type: text
                      text:
                        body: Quero reagendar a entrega
                      context:
                        id: pmid.01JA9VZ6T8R3
      responses:
        '200':
          description: OK
  message_status:
    post:
      tags:
      - Webhooks
      summary: 已发送消息的状态变更
      description: 每次状态变化推送一次：`sent` → `delivered` → `read`，或带 `errors` 的 `failed`。不保证到达顺序，请以 `timestamp` 为准。
      parameters:
      - name: X-Phiz-Signature-256
        in: header
        required: true
        schema:
          type: string
        example: sha256=6f1c…
        description: 使用应用 webhook secret 对 `{timestamp}.{原始请求体}` 计算的 HMAC-SHA256。
      - name: X-Phiz-Timestamp
        in: header
        required: true
        schema:
          type: integer
        example: 1760528527
        description: 发送时的 Unix 时间戳，偏差超过 5 分钟应拒绝。
      - name: X-Phiz-Delivery-Id
        in: header
        required: true
        schema:
          type: string
        example: dlv_01JA9W2D7K
        description: 同一事件的所有重试均相同，可用于去重。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            examples:
              delivered:
                value:
                  object: phiz_merchant_account
                  entry:
                  - id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                    changes:
                    - field: message_status
                      value:
                        messaging_product: phiz
                        metadata:
                          sender_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                          sender_type: merchant
                          conversation_type: business_account
                          display_name: Loja Exemplo
                        statuses:
                        - id: pmid.01JA9VZ6T8R3
                          status: delivered
                          timestamp: '1760528410'
                          recipient_id: '839201447'
                          biz_opaque_callback_data: pedido=48213
                          conversation:
                            id: conv_01JA9W
                            origin:
                              type: service
                            expires_at: '1760614810'
              failed:
                value:
                  object: phiz_merchant_account
                  entry:
                  - id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                    changes:
                    - field: message_status
                      value:
                        messaging_product: phiz
                        metadata:
                          sender_id: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
                          sender_type: merchant
                          conversation_type: business_account
                          display_name: Loja Exemplo
                        statuses:
                        - id: pmid.01JA9X0QW1
                          status: failed
                          timestamp: '1760528600'
                          recipient_id: '+5511900000000'
                          errors:
                          - code: 2104
                            title: recipient_not_reachable
                            message: The phone number is not linked to a PHIZ account or blocked this sender.
                            href: https://developers.phiz.chat/docs/errors#2104
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://gateway.phiz.chat/gateway/business/oauth/token
          scopes:
            messages:send: 发送消息和媒体
            messages:read: 读取消息状态
            webhooks:manage: 管理应用 Webhook
            account:read: 读取账号与发送方
            templates:manage: 预留给 Marketing API
  schemas:
    TokenRequest:
      type: object
      required:
      - grant_type
      - client_id
      - client_secret
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        client_id:
          type: string
          example: app_2Fk81PzQ
          description: 在开发者中心生成的应用 ID（client_id）。
        client_secret:
          type: string
          format: password
          example: phzsk_live_9c1f…
          description: 应用密钥，仅在创建或轮换时显示一次。
        scope:
          type: string
          example: messages:send messages:read
          description: 以空格分隔的请求范围。省略时签发应用已获授权的全部范围。
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - scope
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJFUzI1NiIsImtpZCI6InBoei0yMDI2LTEwIn0…
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          example: 3600
          description: 有效期（秒）。
        scope:
          type: string
          example: messages:send messages:read webhooks:manage
        merchant_id:
          type: string
          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
    TokenInfo:
      type: object
      properties:
        active:
          type: boolean
          example: true
        app_id:
          type: string
          example: app_2Fk81PzQ
        merchant_id:
          type: string
          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        scope:
          type: string
          example: messages:send messages:read
        senders:
          type: array
          items:
            type: string
          example:
          - 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
          - '1231'
          description: 此应用可使用的发送方。
        expires_at:
          type: string
          format: date-time
          example: '2026-10-15T12:30:00Z'
    Merchant:
      type: object
      properties:
        id:
          type: string
          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        name:
          type: string
          example: Loja Exemplo Ltda.
        status:
          type: string
          enum:
          - active
          - restricted
          - suspended
        verification:
          type: string
          enum:
          - unverified
          - pending
          - verified
        created_at:
          type: string
          format: date-time
    Sender:
      type: object
      properties:
        id:
          type: string
          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        type:
          type: string
          enum:
          - merchant
          - channel
          example: merchant
          description: '`merchant`：商户本身，每个商户都有的默认发送方。`channel`：商户的频道，可选。'
        conversation_type:
          type: string
          enum:
          - business_account
          - channel_service
          example: business_account
          description: PhizChat 会话类型（公众号 › Service）：type = merchant 对应 `business_account`，type = channel 对应 `channel_service`。
        display_name:
          type: string
          example: Loja Exemplo
        channel_id:
          type: string
          nullable: true
          example: null
          description: 仅当 type = channel 时有值。
        status:
          type: string
          enum:
          - connected
          - pending_review
          - disabled
        messaging_limit_tier:
          type: string
          example: TIER_1K
          description: 24 小时内可接收企业主动消息的唯一用户数上限。
        quality_rating:
          type: string
          enum:
          - GREEN
          - YELLOW
          - RED
          - UNKNOWN
    SenderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sender'
        paging:
          $ref: '#/components/schemas/Paging'
    Paging:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          example: c2VuZGVyX2lkPXNuZF85
    Recipient:
      description: 接收方。填写 `to`；若不是手机号，需指定 `to_type`。手机号采用 E.164 格式。
      type: object
    SendMessageRequest:
      type: object
      required:
      - to
      - type
      properties:
        messaging_product:
          type: string
          enum:
          - phiz
          default: phiz
          description: 可选；为兼容 Cloud API 而保留。
        recipient_type:
          type: string
          enum:
          - individual
          default: individual
        to:
          type: string
          example: '+5511987654321'
          description: 接收方手机号（E.164）或 PHIZ ID。
        to_type:
          type: string
          enum:
          - phone
          - phiz_id
          default: phone
        type:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - document
          - location
          - interactive
          - reaction
          - template
          description: '`template` 预留给后续的 Marketing API。'
        text:
          $ref: '#/components/schemas/TextContent'
        image:
          $ref: '#/components/schemas/MediaContent'
        video:
          $ref: '#/components/schemas/MediaContent'
        audio:
          $ref: '#/components/schemas/MediaContent'
        document:
          $ref: '#/components/schemas/MediaContent'
        location:
          $ref: '#/components/schemas/LocationContent'
        interactive:
          $ref: '#/components/schemas/InteractiveContent'
        reaction:
          $ref: '#/components/schemas/ReactionContent'
        context:
          type: object
          properties:
            message_id:
              type: string
          description: 引用回复之前的消息。
        biz_opaque_callback_data:
          type: string
          maxLength: 512
          example: pedido=48213
          description: 自定义文本，会在此消息的所有状态 Webhook 中原样返回。
    TextContent:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          maxLength: 4096
          example: 'Olá, Maria! Seu pedido #48213 foi enviado.'
        preview_url:
          type: boolean
          default: false
    MediaContent:
      type: object
      description: 提供 `id`（推荐）或 `link`，二者均由 `POST /v1/{sender_id}/media` 上传后返回。
      anyOf:
      - required:
        - id
      - required:
        - link
      properties:
        id:
          type: string
          example: pmed.01JB2K7Q9X
          description: 上传后返回的媒体 ID，在 `expires_at` 之前有效。
        link:
          type: string
          format: uri
          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X
          description: 上传后返回的 PHIZ 链接。第三方 URL 会被拒绝并返回错误 2302。
        caption:
          type: string
          maxLength: 1024
          description: 音频不适用。
        filename:
          type: string
          description: 仅适用于 document。
    MediaUploadRequest:
      type: object
      required:
      - file
      - type
      properties:
        messaging_product:
          type: string
          enum:
          - phiz
        type:
          type: string
          example: application/pdf
          description: 文件的 MIME 类型，须在第 09 节的格式表中。
        file:
          type: string
          format: binary
    Media:
      type: object
      properties:
        id:
          type: string
          example: pmed.01JB2K7Q9X
        link:
          type: string
          format: uri
          example: https://media.phiz.chat/biz/pmed.01JB2K7Q9X
        mime_type:
          type: string
          example: application/pdf
        file_size:
          type: integer
          example: 184320
        sha256:
          type: string
          example: 9b1f…
        expires_at:
          type: string
          format: date-time
          example: '2026-11-19T14:00:00Z'
          description: 临时存储截止时间（建议：上传后 30 天）。到期后 `id` 和 `link` 失效。
    LocationContent:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          example: -23.5614
        longitude:
          type: number
          example: -46.6559
        name:
          type: string
          example: Loja Paulista
        address:
          type: string
    InteractiveContent:
      type: object
      properties:
        type:
          type: string
          enum:
          - button
          - list
        body:
          type: object
          properties:
            text:
              type: string
        action:
          type: object
          properties:
            buttons:
              type: array
              maxItems: 3
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - reply
                  reply:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                        maxLength: 20
    ReactionContent:
      type: object
      properties:
        message_id:
          type: string
        emoji:
          type: string
          example: 👍
    SendMessageResponse:
      type: object
      properties:
        messaging_product:
          type: string
          example: phiz
        contacts:
          type: array
          items:
            type: object
            properties:
              input:
                type: string
                example: '+5511987654321'
              phiz_id:
                type: string
                nullable: true
                example: null
                description: 仅当接收方曾与该发送方对话时返回。
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: pmid.01JA9VZ6T8R3
              message_status:
                type: string
                enum:
                - accepted
    MessageStatus:
      type: object
      properties:
        id:
          type: string
          example: pmid.01JA9VZ6T8R3
        sender_id:
          type: string
          example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
        status:
          type: string
          enum:
          - accepted
          - sent
          - delivered
          - read
          - failed
        updated_at:
          type: string
          format: date-time
        biz_opaque_callback_data:
          type: string
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    MarkReadRequest:
      type: object
      required:
      - status
      - message_id
      properties:
        messaging_product:
          type: string
          enum:
          - phiz
        status:
          type: string
          enum:
          - read
        message_id:
          type: string
          example: pmid.IN_01JA9W2C
        typing_indicator:
          type: boolean
          default: false
    WebhookConfig:
      type: object
      required:
      - url
      - verify_token
      properties:
        url:
          type: string
          format: uri
          example: https://integracao.lojaexemplo.com.br/phiz/webhook
        verify_token:
          type: string
          writeOnly: true
          example: um-texto-que-so-voce-conhece
          description: 由您设定，会在 GET 握手时回传。
        fields:
          type: array
          items:
            type: string
            enum:
            - messages
            - message_status
            - sender_update
            - account_update
          example:
          - messages
          - message_status
        status:
          type: string
          readOnly: true
          enum:
          - verified
          - pending_verification
          - failing
          - disabled
    WebhookEvent:
      type: object
      description: 所有事件的外层结构，可批量包含同一商户的多个事件。
      properties:
        object:
          type: string
          enum:
          - phiz_merchant_account
        entry:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 7f3e2a10-5b8c-4d21-9e6f-2a1c0b9d4e57
              changes:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      enum:
                      - messages
                      - message_status
                      - sender_update
                      - account_update
                    value:
                      type: object
    ErrorDetail:
      type: object
      properties:
        code:
          type: integer
          example: 2104
        title:
          type: string
          example: recipient_not_reachable
        message:
          type: string
        href:
          type: string
          format: uri
    OAuthError:
      type: object
      description: RFC 6749 §5.2
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_scope
          - unsupported_grant_type
        error_description:
          type: string
          example: Client authentication failed.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              example: 1003
            type:
              type: string
              example: invalid_request
            message:
              type: string
              example: Field 'to' must be E.164 when to_type is 'phone'.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            trace_id:
              type: string
              example: trc_9f2c41ab
  responses:
    BadRequest:
      description: 请求无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 令牌缺失、无效或已过期。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: 1101
              type: unauthorized
              message: Access token expired.
              trace_id: trc_1a2b
    Forbidden:
      description: 应用缺少所需范围或无权使用该发送方。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 超出速率限制，请遵循 Retry-After。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
    ServerError:
      description: 服务器内部错误，可使用相同的 Idempotency-Key 重试。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
