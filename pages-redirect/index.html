<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>PHIZ RFCs mudou de endereço · moved</title>
<!-- The site moved from GitHub Pages to Vercel. Every address of the old site (path, query and #hash) goes to the same address on the
     new one. GitHub Pages answers unknown paths with 404.html, which is this same page, so deep links keep working. -->
<script>
  (function () {
    var target = "https://phiz-rfcs.vercel.app";
    var path = location.pathname.replace(/^\/phiz-rfcs(?=\/|$)/, "") || "/";
    location.replace(target + path + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="3;url=https://phiz-rfcs.vercel.app/">
</head>
<body style="font-family:system-ui,sans-serif;padding:2rem">

The RFC site moved to <a href="https://phiz-rfcs.vercel.app/">phiz-rfcs.vercel.app</a>. RFC 站点已迁移至 <a href="https://phiz-rfcs.vercel.app/">phiz-rfcs.vercel.app</a>。</p>
</body>
</html>
